# Elasticsearch service for local/CI smoke testing of the Elasticsearch search module
# (`backend/modules/search/elasticsearch/`).
#
# Not part of the app's own runtime stack: nothing under `backend/` talks to Elasticsearch unless a
# site's `config.search.engine` is explicitly set to `elasticsearch`. This file exists so
# `backend/modules/search/elasticsearch/search.smoke.test.ts` (gated on `ELASTICSEARCH_TEST_URL`) has
# a real cluster to index into and query, on demand:
#
#   docker compose -f dev/docker-compose.search-test.yml up -d --wait
#   ELASTICSEARCH_TEST_URL=http://127.0.0.1:59200 \
#     node --test modules/search/elasticsearch/search.smoke.test.ts   # from backend/
#   docker compose -f dev/docker-compose.search-test.yml down -v
#
# Security is disabled and the port is bound to loopback only -- this is a throwaway single-node
# cluster for a test run, never a deployment target.
#
# Image tag: Elasticsearch has no separate LTS line, so this repo's Currency standard means the
# latest stable release on the major `backend/package.json`'s `@elastic/elasticsearch` pin targets.
# Keep server and client in step when either is next bumped.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '127.0.0.1:59200:9200'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow || exit 1'
        ]
      interval: 5s
      timeout: 5s
      retries: 40
