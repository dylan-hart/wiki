# Verification-only overlay on top of `dev/build/config.yml`, mounted in by
# `verify-sandboxed-puppeteer.sh` via `CONFIG_FILE` -- never baked into the image itself, and never
# used by a real deployment.
#
# The one thing this changes: `security.cookieSecure: false`. This verification run's own HTTP client
# talks to the container over plain, unterminated HTTP (a published `docker run -p` port, no reverse
# proxy, no TLS anywhere in the chain) -- exactly the case `core/http/session.ts`'s own cookie-security
# comment documents as the deliberate fail-closed scenario for the real `__Host-`-prefixed, `Secure`
# session cookie: no session cookie is issued at all rather than an insecure one. Session-cookie login
# has nothing to do with what this script is actually verifying (Chromium's OWN process sandbox inside
# the container, gated by `security.allowPuppeteerNoSandbox` -- a completely different config key, left
# untouched here and still at its `base.yml` default of `false`), so this override exists purely to let
# a plain-HTTP verification client log in at all, exactly as `base.yml`'s own doc comment on
# `cookieSecure` names this as the documented escape hatch for a non-HTTPS instance.
port: 3000
bindIP: 0.0.0.0
db:
  host: '$(DB_HOST)'
  port: $(DB_PORT:5432)
  user: '$(DB_USER)'
  pass: '$(DB_PASS)'
  db: $(DB_NAME)
  schema: $(DB_SCHEMA:wiki)
  ssl: $(DB_SSL:false)
logLevel: $(LOG_LEVEL:info)
logFormat: $(LOG_FORMAT:text)
offline: $(WIKI_OFFLINE:false)
dataPath: ./data
scheduler:
  workers: auto
security:
  cookieSecure: false
