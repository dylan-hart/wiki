# Verification-only overlay on top of `dev/build/config.yml`, mounted in by
# `verify-sandboxed-puppeteer.sh` via `CONFIG_FILE` -- never baked into the image itself, and never
# used by a real deployment.
#
# `security.cookieSecure: false` is the only change: this run's client talks to the container over
# plain HTTP, where the real `__Host-`-prefixed `Secure` cookie is not issued at all, so it could
# not log in. It is unrelated to `security.allowPuppeteerNoSandbox`, which stays at its `base.yml`
# default of `false` -- Chromium's own process sandbox is what this run verifies.
port: 3000
bindIP: 0.0.0.0
db:
  host: '$(DB_HOST)'
  port: $(DB_PORT:5432)
  user: '$(DB_USER)'
  pass: '$(DB_PASS)'
  db: $(DB_NAME)
  schema: $(DB_SCHEMA:wiki)
  ssl: $(DB_SSL:false)
logLevel: $(LOG_LEVEL:info)
logFormat: $(LOG_FORMAT:text)
offline: $(WIKI_OFFLINE:false)
dataPath: ./data
scheduler:
  workers: auto
security:
  cookieSecure: false
