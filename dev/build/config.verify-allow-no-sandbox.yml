# Verification-only overlay, mounted in by `verify-sandboxed-puppeteer.sh --allow-no-sandbox` --
# never baked into the image, and never used by a real deployment. `config.verify.yml` plus
# `security.allowPuppeteerNoSandbox: true`, the documented fallback for an environment that cannot
# give Chromium its own sandbox: this run confirms that fallback still works on its own terms,
# whatever the default run found.
port: 3000
bindIP: 0.0.0.0
db:
  host: '$(DB_HOST)'
  port: $(DB_PORT:5432)
  user: '$(DB_USER)'
  pass: '$(DB_PASS)'
  db: $(DB_NAME)
  schema: $(DB_SCHEMA:wiki)
  ssl: $(DB_SSL:false)
logLevel: $(LOG_LEVEL:info)
logFormat: $(LOG_FORMAT:text)
offline: $(WIKI_OFFLINE:false)
dataPath: ./data
scheduler:
  workers: auto
security:
  cookieSecure: false
  allowPuppeteerNoSandbox: true
