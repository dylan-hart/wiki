# The CI-parity development environment: `docker compose up` starts exactly what a CI job has.
# Developer-only services sit behind the `tools` profile, so the default environment is the one
# that gates rather than a superset of it.
#
#   docker compose up                     # app + db + minio  -- what CI has
#   docker compose --profile tools up     # + pgAdmin          -- local convenience

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # No `args:` on purpose: a build arg here would override the Dockerfile's `ARG NODE_VERSION`,
      # the single declaration of the Node pin.

    volumes:
      - ..:/workspace
      - wiki-vscode-ext:/root/.vscode-server/extensions

    # DATABASE_URL is character-for-character what every workflow sets, and matches the `db` service
    # below (at localhost because of `network_mode: service:db`). With it set, backend/test/db.ts's
    # `hasTestDatabase()` gate runs the DB-backed suites instead of silently skipping them.
    # core/db.ts prefers it outright over config.yml's `db:` block: unset it in your shell before
    # pointing config.yml somewhere else. S3_TEST_ENDPOINT is the same convention, for `minio`.
    environment:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Without ADMIN_PASS, `models/users.ts#init()` seeds a random one-time password; a dev
      # container wants the known, repeatable login README.md documents.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASS: '12345678'
      S3_TEST_ENDPOINT: http://minioadmin:minioadmin@localhost:9000

    # Keeps the container running; the backend is started by hand inside it.
    command: sleep infinity

    # Shares the db container's network, so db and minio are at localhost. Forward app ports with
    # devcontainer.json's `forwardPorts`: a `ports:` entry here does not forward from a Codespace.
    network_mode: service:db

  db:
    # The tag CI's postgres service containers use. Deliberately the bare major rather than a
    # digest: parity here means resolving the same way CI does.
    image: postgres:18
    restart: unless-stopped
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory and expects the
      # volume mounted at /var/lib/postgresql (not /var/lib/postgresql/data).
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

  minio:
    # Keep in sync with the tag quality.yml's "Start MinIO" step pulls. MinIO publishes to quay.io
    # only and has no floating LTS-major tag, so a concrete RELEASE tag is the pin.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    network_mode: service:db

  pgadmin:
    profiles:
      - tools
    image: dpage/pgadmin4:9.13.0
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@js.wiki
      - PGADMIN_DEFAULT_PASSWORD=123123
      - PGADMIN_DISABLE_POSTFIX=True
      - PGADMIN_LISTEN_PORT=8000
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_CONFIG_LOGIN_BANNER="Login with dev@js.wiki / 123123"
    network_mode: service:db
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    # TODO: mount ./pgadmin-servers.json at /pgadmin4/servers.json; it is never loaded, so pgAdmin
    # starts with no server registered.

volumes:
  postgres-data:
  minio-data:
  wiki-vscode-ext:
