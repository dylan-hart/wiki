# The CI-parity development environment (OpenProject #2684, under Feature #2601).
#
# What `docker compose up` starts here is exactly what a CI job has: one Node container and one
# postgres:18. Developer-only services -- currently just pgAdmin -- sit behind the `tools` profile
# and are opted into explicitly, so the environment you work in by default is the environment that
# gates, rather than a superset of it.
#
#   docker compose up                     # app + db      -- what CI has
#   docker compose --profile tools up     # + pgAdmin     -- local convenience

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NOTHING is overridden here on purpose. The Dockerfile's own `ARG NODE_VERSION` is the single
      # declaration of the pinned Node patch, and this file used to defeat it: it passed
      # `VARIANT: 26` over a Dockerfile that carefully digest-pinned 26.7.0, so every rebuild
      # silently resolved whatever `node:26` was newest that day and the pin was dead on arrival.
      # To change the Node version, edit the Dockerfile (and .github/workflows/*.yml with it).

    volumes:
      - ..:/workspace
      - wiki-vscode-ext:/root/.vscode-server/extensions

    # Matches the `db` service's own credentials below (reachable at localhost:5432, since this
    # container runs on `network_mode: service:db`) and config.sample.yml's db defaults exactly, so
    # `npm run dev` / `npm run start` keep connecting exactly as they always have -- as long as
    # config.yml's own `db:` block is left at its default values (see README.md's "Usage" steps).
    # It is also character-for-character the DATABASE_URL every workflow sets, which is what makes
    # a DB-backed run in here and a DB-backed run in CI the same run.
    # What this actually changes is backend/test/db.ts's `hasTestDatabase()` gate: with it set,
    # `npm run test` in backend/ runs the DB-backed suites instead of silently skipping them.
    # If you edit config.yml's `db:` block to point somewhere else, unset this in your own shell
    # first -- core/db.ts prefers DATABASE_URL outright over WIKI.config.db.* whenever it's set.
    environment:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Uncomment the next line to use a non-root user for all processes.
    # user: node

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    # Same tag the service containers in quality.yml, build.yml and e2e.yml use, and the one
    # backend/test/db.ts documents. Deliberately the bare major rather than a digest: parity here
    # means resolving the same way CI does, and CI resolves `postgres:18`.
    image: postgres:18
    restart: unless-stopped
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory and expects the
      # volume mounted at /var/lib/postgresql (not /var/lib/postgresql/data).
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

  pgadmin:
    # Developer convenience, not part of the gate: CI has no pgAdmin, so neither does the default
    # environment here. Start it with `docker compose --profile tools up` when you actually want it.
    profiles:
      - tools
    image: dpage/pgadmin4:9.13.0
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@js.wiki
      - PGADMIN_DEFAULT_PASSWORD=123123
      - PGADMIN_DISABLE_POSTFIX=True
      - PGADMIN_LISTEN_PORT=8000
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_CONFIG_LOGIN_BANNER="Login with dev@js.wiki / 123123"
    network_mode: service:db
    # volumes:
      # - ./pgadmin-servers.json:/pgadmin4/servers.json

volumes:
  postgres-data:
  wiki-vscode-ext:
