# ---------------------------------
# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: Wiki.js
defaults:
  config:
    # File defaults
    port: 80
    db:
      host: localhost
      port: 5432
      user: wikijs
      pass: wikijsrocks
      db: wiki
      ssl: false
      sslOptions:
        auto: true
      schema: wiki
    ssl:
      enabled: false
    pool:
      min: 1
    bindIP: 0.0.0.0
    logLevel: info
    logFormat: default
    offline: false
    dataPath: ./data
    # In BYTES. Fastify's `bodyLimit` takes an integer and refuses anything else at boot, unlike the
    # 2.x body parser this default was written for, which took '5mb'.
    bodyParserLimit: 5242880
    icons:
      # Iconify API the wiki fetches icons from the first time they are used. Point this at a
      # self-hosted Iconify API to keep icon lookups inside your network.
      apiUrl: 'https://api.iconify.design'
    files:
      # How much of <dataPath>/cache/files the served copies of uploaded files may take up, in bytes.
      # Trimmed back oldest-first once it is exceeded. Set to 0 to serve every request from the
      # database instead.
      cacheMaxSize: 536870912
    scheduler:
      workers: 3
      pollingCheck: 5
      scheduledCheck: 300
      maxRetries: 2
      retryBackoff: 60
      historyExpiration: 90000
      # How long, in seconds, a job running in a worker thread may take before the scheduler stops
      # waiting for it and counts it as failed. A safety net rather than a schedule: a worker thread
      # that dies mid-task never answers at all, and without a ceiling the scheduler waits forever.
      taskTimeout: 300
      # How long, in seconds, a job may sit marked as running before it is assumed that whatever was
      # running it is gone, and it is requeued. Deliberately generous: it has to outlast the longest
      # job the instance legitimately runs, since the alternative is starting a second copy of one.
      staleJobTimeout: 3600
      # Caps how many `dispatchWebhook` jobs a single webhook may have queued per window (see
      # `models/hooks.ts#emit()`). Protects both the remote endpoint and this shared job queue from one
      # busy hook; deliveries beyond the cap are skipped (never queued, never retried) and logged.
      webhookRateLimitMax: 60
      webhookRateLimitWindow: '1m'
      webhookRateLimitBan: '1m'
    # DB defaults
    api:
      isEnabled: false
    mail:
      host: ''
      secure: true
      verifySSL: true
    metrics:
      isEnabled: false
    # Whether page views are logged at all (OpenProject #1238) -- on by default, the admin opt-out this
    # feeds is a `manage:system` toggle in `api/system.ts`. Off means the write path no-ops entirely:
    # no row is ever inserted, not merely hidden from a later read.
    pageviews:
      isEnabled: true
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
      secret: 'abcdef1234567890abcdef1234567890abcdef'
    security:
      corsMode: 'OFF'
      corsConfig: ''
      enforceCsp: false
      trustProxy: false
      enforceHsts: false
      hstsDuration: 0
      # A known-good starting policy for when `enforceCsp` is turned on -- shipped, but not applied
      # by default, so turning that toggle on is one click rather than a research project. Covers
      # what the core app itself needs:
      #  - `worker-src 'self' blob:` for Monaco's bundled language workers (`boot/monaco.js`)
      #  - `script-src 'self'` for same-origin custom/built-in blocks, loaded as dynamic ES module
      #    imports from `/_blocks/...` (`stores/common.js#blockImportUrl`)
      #  - `style-src 'self' 'unsafe-inline'` and `font-src 'self' data:` for Vue's `:style`
      #    bindings and bundled block fonts (e.g. KaTeX)
      #  - `img-src` and `connect-src` allowing `https:` for blocks that call out to a configurable
      #    external server by design (`block-kroki`, `block-plantuml` default to kroki.io /
      #    plantuml.com, but an admin may point them anywhere), and wiki content routinely embedding
      #    externally-hosted images
      # NOT covered, because they are admin-authored and instance-specific: theme HTML/CSS injection
      # (`AdminTheme.vue`'s injectHead/injectBody/injectCSS) and analytics providers (Google
      # Analytics, GTM, Matomo) each need their own allowances added here -- see the hint above.
      cspDirectives: "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https:"
      uploadScanSVG: true
      disallowIframe: true
      uploadMaxFiles: 20
      uploadMaxFileSize: 10485760
      forceAssetDownload: true
      disallowOpenRedirect: true
      enforceSameOriginReferrerPolicy: true
      authRateLimitEnabled: true
      authRateLimitMax: 10
      authRateLimitWindow: '2m'
      authRateLimitBan: '15m'
      apiRateLimitEnabled: true
      apiRateLimitMax: 300
      apiRateLimitWindow: '5m'
      apiRateLimitBan: '15m'
    flags:
      experimental: false
      authDebug: false
      sqlLog: false
    userDefaults:
      timezone: 'America/New_York'
      dateFormat: 'YYYY-MM-DD'
      timeFormat: '12h'
    update:
      # Whether the daily updateLocales scheduled job is allowed to pull the latest strings from
      # requarks/wiki-locales. Set to false to disable automatic locale syncing.
      locales: true
    # System defaults
    channel: NEXT
    maintainerEmail: security@requarks.io
