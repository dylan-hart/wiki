# ---------------------------------
# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: Cardinal.js
defaults:
  config:
    # File defaults
    port: 80
    db:
      host: localhost
      port: 5432
      user: cardinaljs
      pass: cardinaljsrocks
      db: wiki
      ssl: false
      sslOptions:
        auto: true
      schema: wiki
    pool:
      min: 1
      # Explicit, at double node-postgres's default of 10: a few concurrent requests against a
      # whole-table surface (sitemap, knowledge graph, icon-set lookup) can fill the pool and queue
      # every other query behind them, logins included. Kept well under Postgres' default
      # `max_connections` (100), which other instances, the scheduler's worker-thread pools, the
      # LISTEN pool (helpers/pubsub.ts) and admin connections share.
      max: 20
      connectionTimeoutMillis: 5000
      statementTimeoutMillis: 60000
    bindIP: 0.0.0.0
    # Validated at boot by core/logger.ts, case-sensitively: logLevel is error/warn/info/debug,
    # logFormat text/json. Anything else refuses to boot.
    logLevel: info
    logFormat: text
    # Optional map of log scope (core/logScopes.ts) to level, overriding logLevel for that scope
    # alone -- `logScopes: { http: debug, sql: error }`. Validated at boot like the two keys above.
    # An explicit null rather than `{}` on purpose: core/config.ts#warnUnknownConfigKeys descends
    # into any key that is a plain object on both sides, so with `{}` every real entry of this
    # free-form map would warn as an unknown key on every boot.
    logScopes: ~
    # Slow-query threshold in milliseconds; 0 is off. A main-pool query taking at least this long
    # emits one `warn sql slow query` line. File-only, so changing it takes a restart. See
    # core/db.ts#instrumentSlowQueries for what is and is not timed.
    slowQueryMs: 0
    offline: false
    dataPath: ./data
    # In bytes: Fastify's `bodyLimit` takes an integer and refuses anything else at boot.
    bodyParserLimit: 5242880
    icons:
      apiUrl: 'https://api.iconify.design'
    files:
      # In bytes, the cap on <dataPath>/cache/files (trimmed oldest-first). 0 serves every request
      # from the database instead.
      cacheMaxSize: 536870912
    scheduler:
      workers: 3
      pollingCheck: 5
      scheduledCheck: 300
      maxRetries: 2
      retryBackoff: 60
      historyExpiration: 90000
      # Seconds a job may run before the scheduler stops waiting and counts it as failed. A
      # worker-thread job is aborted; an in-process job cannot be and is only raced against a
      # timer, which still frees the worker slot a never-settling promise would strand forever.
      taskTimeout: 300
      # Seconds a job may sit marked as running before its runner is presumed gone and it is
      # requeued. Must outlast the longest legitimate job, or a second copy of one starts.
      staleJobTimeout: 3600
      # Caps how many `dispatchWebhook` jobs one webhook may queue per window
      # (`models/hooks.ts#emit()`), protecting the remote endpoint and the shared job queue.
      # Deliveries beyond the cap are skipped -- never queued, never retried -- and logged.
      webhookRateLimitMax: 60
      webhookRateLimitWindow: '1m'
      webhookRateLimitBan: '1m'
    # DB defaults
    api:
      isEnabled: false
    mail:
      host: ''
      secure: true
      verifySSL: true
    metrics:
      isEnabled: false
    # Scheduled replication pulls a full wipe-and-replace snapshot from another instance on a cron
    # schedule. Off by default because the pull is destructive to the target. `lastRunAt` is
    # written by `models/replication.ts`'s `tick()`, never by an operator.
    replication:
      isEnabled: false
      sourceUrl: ''
      # An API key generated ON the source instance (for its bulk-export API) and pasted in here,
      # not one this instance issues.
      bearerToken: ''
      cronSchedule: ''
      lastRunAt: null
    # Off means the write path no-ops entirely: no row is inserted, not merely hidden from reads.
    pageviews:
      isEnabled: true
      # Placeholder: the real value is generated at first run (`models/settings.ts#init()`) and
      # stored in the `settings` table. Keys `hashVisitor()`'s HMAC so a stored `visitorHash`
      # can't be re-derived from `sessions.id`/`apiKeys.id` without it.
      hashKey: ''
    # Only a backstop for a database that predates this key -- the `settings` table row governs a
    # live instance. Must match `models/auditLog.ts`'s `DEFAULT_AUDIT_LOG_RETENTION_DAYS`.
    auditLog:
      retentionDays: 365
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
    security:
      allowPasskeys: true
      corsMode: 'OFF'
      corsConfig: ''
      enforceCsp: false
      trustProxy: false
      # -> `@fastify/session` never emits a `Secure` cookie unless the connection it saw was TLS
      #    (`request.protocol === 'https'`), loopback or not, so over plain HTTP login silently sets
      #    no cookie at all. `false` is the escape hatch for a local dev instance with no TLS
      #    anywhere in the chain: it drops both `Secure` and the `__Host-` prefix, which requires
      #    `Secure` (`helpers/security.ts#sessionCookieName()`). Nothing auto-detects loopback, so
      #    `false` on a network-reachable instance really does remove the hardening.
      cookieSecure: true
      enforceHsts: false
      hstsDuration: 0
      # -> A known-good starting point for `enforceCsp`, which requires at least one directive once
      #    turned on. `object-src`/`base-uri`/`frame-ancestors` are the baseline; the rest is sized
      #    to what the app itself needs:
      #      - `script-src 'self'` / `worker-src 'self' blob:` -- Monaco's language workers and the
      #        custom-blocks loader (`/_blocks/**`) are same-origin; `blob:` covers a worker Monaco
      #        spins up via an object URL.
      #      - `style-src 'self' 'unsafe-inline'` -- KaTeX renders every expression as a tree of
      #        inline `style="..."` attributes, and there is no practical nonce/hash story for
      #        content an editor can retype at any time.
      #      - `img-src 'self' data: https:` / `connect-src 'self' https:` -- `block-kroki` and
      #        `block-plantuml` fetch from an admin-configured diagram server, so the host can't be
      #        pinned; `data:` covers KaTeX/icon-inlined images.
      #      - `frame-src 'self' https:` -- the video blocks embed a provider iframe whose host is
      #        fixed per block or, for `block-m365-video`, operator-supplied.
      #      - `font-src 'self' data:` -- KaTeX's bundled webfonts.
      #    Deliberately NOT covered: theme HTML injection (`site.theme.injectHead`/`injectBody`) and
      #    the `google`/`gtm`/`matomo` analytics modules, which load scripts from their own origins.
      #    Those need directives this default can't guess; `AdminSecurity.vue`'s CSP hint says so.
      #    `backend/helpers/security.test.ts` asserts this string parses as expected.
      cspDirectives: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      uploadScanSVG: true
      disallowIframe: true
      uploadMaxFileSize: 10485760
      # -> Bounds how much one synchronous multipart parse on the batch upload endpoints can be made
      #    to do. Not a user quota: looping the single-file endpoint reaches the same file count.
      #    Enforced by `@fastify/multipart`'s `limits.files` at parse time, before a file over the
      #    count is read into memory.
      uploadMaxFilesPerBatch: 10
      forceAssetDownload: true
      disallowOpenRedirect: true
      enforceSameOriginReferrerPolicy: true
      authRateLimitEnabled: true
      authRateLimitMax: 10
      authRateLimitWindow: '2m'
      authRateLimitBan: '15m'
      apiRateLimitEnabled: true
      apiRateLimitMax: 300
      apiRateLimitWindow: '5m'
      apiRateLimitBan: '15m'
      # Set true only where the environment cannot give Chromium its own sandbox (typically a
      # container without the setuid helper). It drops the process sandbox for every headless
      # launch, including the ones rendering attacker-influenced content (a live page view with the
      # requester's session cookie, POSTed Mermaid source).
      allowPuppeteerNoSandbox: false
    flags:
      experimental: false
      authDebug: false
      sqlLog: false
    userDefaults:
      timezone: 'America/New_York'
      dateFormat: 'YYYY-MM-DD'
      timeFormat: '12h'
    update:
      # Whether the daily updateLocales job may pull the latest strings from requarks/wiki-locales.
      locales: true
      releasesUrl: 'https://api.github.com/repos/dylan-hart/wiki/releases'
    # Upstream Wiki.js's docs site, prepended to every in-app "view docs" / help link
    # (`siteStore.docsBase` on the frontend).
    docsBase: 'https://beta.js.wiki/docs'
    # Dev mode only: core/db.ts reads dropSchema, frontend/vite.config.js reads port and
    # hmrClientPort. Declared here so `warnUnknownConfigKeys()` does not flag config.sample.yml's
    # `dev:` block on every dev boot.
    dev:
      dropSchema: false
      port: 3001
      hmrClientPort: 3001
systemIds:
  localAuthId: '5a528c4c-0a82-4ad2-96a5-2b23811e6588'
  guestsGroupId: '10000000-0000-4000-8000-000000000001'
  usersGroupId: '20000000-0000-4000-8000-000000000002'
  classificationPublicId: '30000000-0000-4000-8000-000000000001'
  classificationInternalId: '30000000-0000-4000-8000-000000000002'
  classificationRestrictedId: '30000000-0000-4000-8000-000000000003'
  systemUserId: '40000000-0000-4000-8000-000000000001'
groups:
  defaultPermissions:
    - 'read:pages'
    - 'read:assets'
    - 'read:comments'
    - 'write:comments'
  defaultRules:
    - name: Default Rule
      mode: ALLOW
      match: START
      roles:
        - 'read:pages'
        - 'read:assets'
        - 'read:comments'
        - 'write:comments'
      path: ''
      locales: []
      sites: []
