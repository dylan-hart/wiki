# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: Wiki.js
defaults:
  config:
    # File defaults
    port: 80
    db:
      host: localhost
      port: 5432
      user: wikijs
      pass: wikijsrocks
      db: wiki
      ssl: false
      sslOptions:
        auto: true
      schema: wiki
    ssl:
      enabled: false
    pool:
      min: 1
    bindIP: 0.0.0.0
    logLevel: info
    logFormat: default
    offline: false
    dataPath: ./data
    # In BYTES. Fastify's `bodyLimit` takes an integer and refuses anything else at boot, unlike the
    # 2.x body parser this default was written for, which took '5mb'.
    bodyParserLimit: 5242880
    icons:
      # Iconify API the wiki fetches icons from the first time they are used. Point this at a
      # self-hosted Iconify API to keep icon lookups inside your network.
      apiUrl: 'https://api.iconify.design'
    files:
      # How much of <dataPath>/cache/files the served copies of uploaded files may take up, in bytes.
      # Trimmed back oldest-first once it is exceeded. Set to 0 to serve every request from the
      # database instead.
      cacheMaxSize: 536870912
    scheduler:
      workers: 3
      pollingCheck: 5
      scheduledCheck: 300
      maxRetries: 2
      retryBackoff: 60
      historyExpiration: 90000
      # How long, in seconds, a job running in a worker thread may take before the scheduler stops
      # waiting for it and counts it as failed. A safety net rather than a schedule: a worker thread
      # that dies mid-task never answers at all, and without a ceiling the scheduler waits forever.
      taskTimeout: 300
      # How long, in seconds, a job may sit marked as running before it is assumed that whatever was
      # running it is gone, and it is requeued. Deliberately generous: it has to outlast the longest
      # job the instance legitimately runs, since the alternative is starting a second copy of one.
      staleJobTimeout: 3600
      # Caps how many `dispatchWebhook` jobs a single webhook may have queued per window (see
      # `models/hooks.ts#emit()`). Protects both the remote endpoint and this shared job queue from one
      # busy hook; deliveries beyond the cap are skipped (never queued, never retried) and logged.
      webhookRateLimitMax: 60
      webhookRateLimitWindow: '1m'
      webhookRateLimitBan: '1m'
    # DB defaults
    api:
      isEnabled: false
    mail:
      host: ''
      secure: true
      verifySSL: true
    metrics:
      isEnabled: false
    # Whether page views are logged at all (OpenProject #1238) -- on by default, the admin opt-out this
    # feeds is a `manage:system` toggle in `api/system.ts`. Off means the write path no-ops entirely:
    # no row is ever inserted, not merely hidden from a later read.
    pageviews:
      isEnabled: true
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
      secret: 'abcdef1234567890abcdef1234567890abcdef'
    security:
      corsMode: 'OFF'
      corsConfig: ''
      enforceCsp: false
      trustProxy: false
      enforceHsts: false
      hstsDuration: 0
      # -> Known-good default so flipping `enforceCsp` on is one click, not a research project --
      #    see docs/audit-2026-08-24/security/08-frontend-client.md §10 and OpenProject #2154/#2158.
      #    `enforceCsp` itself stays false above; only the string an operator would turn on is
      #    shipped here. Proved live -- editor session (Monaco), several shipped blocks/ and KaTeX --
      #    by `e2e/tests/csp.spec.js` (OpenProject #2166), which runs the whole e2e suite with
      #    `enforceCsp: true` (see `e2e/config.e2e.yml`) against exactly this string.
      #      script-src/style-src/img-src/font-src/connect-src 'self': the app bundle, blocks/ (same-
      #        origin ES modules under /_blocks/) and twemoji/font assets are all same-origin; no
      #        analytics or external font CDN is wired in by default (an operator turning one on adds
      #        its origin here explicitly -- not silently opened up).
      #      worker-src 'self' blob:: Monaco's own workers, which Vite's production build always
      #        instantiates from a `blob:` URL (see frontend/vite.config.js's `worker.format` note).
      #      style-src 'unsafe-inline': Vue's `:style` bindings and the inline `style` attributes
      #        KaTeX renders into its output -- there is no practical nonce/hash story for a
      #        per-element style attribute.
      #      img-src additionally allows data: (inline SVG/icon data) and https: (an author-embedded
      #        image, e.g. block-gallery's own template, is not necessarily same-origin).
      #      font-src additionally allows data:: block-katex's font-face rules are inlined as data:
      #        URIs (see blocks/block-katex/component.js).
      #      object-src 'none'; base-uri 'self'; frame-ancestors 'none': belt-and-braces baseline: no
      #        plugin content, no base-tag hijacking of the SPA's own relative module loads, no
      #        embedding this instance in someone else's frame (already covered for current browsers
      #        by `disallowIframe`'s X-Frame-Options, but a CSP-only client benefits too).
      cspDirectives: "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'"
      uploadScanSVG: true
      disallowIframe: true
      uploadMaxFiles: 20
      uploadMaxFileSize: 10485760
      forceAssetDownload: true
      disallowOpenRedirect: true
      enforceSameOriginReferrerPolicy: true
      authRateLimitEnabled: true
      authRateLimitMax: 10
      authRateLimitWindow: '2m'
      authRateLimitBan: '15m'
      apiRateLimitEnabled: true
      apiRateLimitMax: 300
      apiRateLimitWindow: '5m'
      apiRateLimitBan: '15m'
    flags:
      experimental: false
      authDebug: false
      sqlLog: false
    userDefaults:
      timezone: 'America/New_York'
      dateFormat: 'YYYY-MM-DD'
      timeFormat: '12h'
    update:
      # Whether the daily updateLocales scheduled job is allowed to pull the latest strings from
      # requarks/wiki-locales. Set to false to disable automatic locale syncing.
      locales: true
    # System defaults
    channel: NEXT
    maintainerEmail: security@requarks.io
