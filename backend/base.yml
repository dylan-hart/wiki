# ---------------------------------
# DO NOT EDIT THIS FILE!
# This is reserved for system use!
# ---------------------------------
name: Wiki.js
defaults:
  config:
    # File defaults
    port: 80
    db:
      host: localhost
      port: 5432
      user: wikijs
      pass: wikijsrocks
      db: wiki
      ssl: false
      sslOptions:
        auto: true
      schema: wiki
    pool:
      min: 1
      # node-postgres defaults `max` to 10 when unset (OpenProject #2276). A handful of concurrent
      # requests against any unmetered whole-table surface (sitemap/knowledge-graph generation,
      # icon-set lookup) can occupy that whole pool, queuing every other query behind them, logins
      # included. Sized here at 20 (double the library default) to give a single instance real
      # headroom under such a burst while staying well under Postgres' own default `max_connections`
      # (100), which also has to cover other app instances, the scheduler's worker-thread pools
      # (each a separate `{min:0,max:1}` connection — see `workerMode` in `core/db.ts`), and
      # admin/maintenance connections. `max` also needs headroom above the 3 connections permanently
      # held open for LISTEN (event bus in core/db.ts, scheduler in core/scheduler.ts, collab in
      # core/collab.ts, all checked out via helpers/pubsub.ts) — see config.sample.yml's `pool:`
      # section for the operator-facing writeup.
      max: 20
      connectionTimeoutMillis: 5000
      statementTimeoutMillis: 60000
    bindIP: 0.0.0.0
    logLevel: info
    logFormat: default
    offline: false
    dataPath: ./data
    # In BYTES. Fastify's `bodyLimit` takes an integer and refuses anything else at boot, unlike the
    # 2.x body parser this default was written for, which took '5mb'.
    bodyParserLimit: 5242880
    icons:
      # Iconify API the wiki fetches icons from the first time they are used. Point this at a
      # self-hosted Iconify API to keep icon lookups inside your network.
      apiUrl: 'https://api.iconify.design'
    files:
      # How much of <dataPath>/cache/files the served copies of uploaded files may take up, in bytes.
      # Trimmed back oldest-first once it is exceeded. Set to 0 to serve every request from the
      # database instead.
      cacheMaxSize: 536870912
    scheduler:
      workers: 3
      pollingCheck: 5
      scheduledCheck: 300
      maxRetries: 2
      retryBackoff: 60
      historyExpiration: 90000
      # How long, in seconds, a job may take before the scheduler stops waiting for it and counts it
      # as failed. Applies to both worker-thread jobs (aborted via AbortSignal, plus a backup timer
      # for a worker that dies mid-task and never answers at all) and in-process jobs (raced against
      # a timer only -- an in-process task cannot actually be aborted, so the scheduler's own
      # bookkeeping becoming finite is the point: without this, a task whose promise never settles
      # -- `withAdvisoryLock` waiting past its own lock_timeout is the documented case -- permanently
      # strands the worker slot it holds). A safety net rather than a schedule either way.
      taskTimeout: 300
      # How long, in seconds, a job may sit marked as running before it is assumed that whatever was
      # running it is gone, and it is requeued. Deliberately generous: it has to outlast the longest
      # job the instance legitimately runs, since the alternative is starting a second copy of one.
      staleJobTimeout: 3600
      # Caps how many `dispatchWebhook` jobs a single webhook may have queued per window (see
      # `models/hooks.ts#emit()`). Protects both the remote endpoint and this shared job queue from one
      # busy hook; deliveries beyond the cap are skipped (never queued, never retried) and logged.
      webhookRateLimitMax: 60
      webhookRateLimitWindow: '1m'
      webhookRateLimitBan: '1m'
    # DB defaults
    api:
      isEnabled: false
    mail:
      host: ''
      secure: true
      verifySSL: true
    metrics:
      isEnabled: false
    # Whether page views are logged at all (OpenProject #1238) -- on by default, the admin opt-out this
    # feeds is a `manage:system` toggle in `api/system.ts`. Off means the write path no-ops entirely:
    # no row is ever inserted, not merely hidden from a later read.
    pageviews:
      isEnabled: true
      # Real value is generated at first run (`models/settings.ts#init()`, mirroring `auth.secret`
      # below) and stored in the `settings` table -- this placeholder is only ever seen before that
      # seeding runs. Keys `hashVisitor()`'s HMAC so a stored `visitorHash` can't be re-derived from
      # `sessions.id`/`apiKeys.id` without it.
      hashKey: ''
    # Scheduled clean-slate replication from another instance (OpenProject #2437): pull a full
    # snapshot from `sourceUrl` (another Wiki.js 3.x instance) on `cron` and wipe-and-replace this
    # instance's own data with it. Instance-level, not per-site -- see
    # `models/replication.ts`/`tasks/simple/replication-tick.ts`. `sourceToken` is a bearer PAT for
    # the source instance (reusing the existing `models/apiKeys.ts` PAT auth, per the epic's own
    # scope), and `lastRunAt` is written back by `tick()` each time it queues a pull -- an operator
    # never sets it by hand.
    replication:
      enabled: false
      sourceUrl: ''
      sourceToken: ''
      cron: ''
      lastRunAt: null
    # Only a backstop for a database that predates this key's introduction (the `settings` table row
    # is what actually governs a live instance -- see `models/settings.ts#init()` and
    # `models/auditLog.ts`'s `DEFAULT_AUDIT_LOG_RETENTION_DAYS`, which this must match).
    auditLog:
      retentionDays: 365
    auth:
      autoLogin: false
      enforce2FA: false
      hideLocal: false
      loginBgUrl: ''
    security:
      corsMode: 'OFF'
      corsConfig: ''
      enforceCsp: false
      trustProxy: false
      # -> Task 2109 / WP 2105 §2 pinned the session cookie `Secure` (and its `__Host-` prefix, which
      #    requires `Secure`) unconditionally, on the assumption that a plain-`http://localhost` dev
      #    instance would still work because browsers treat loopback as a trustworthy origin. That
      #    assumption was wrong: `@fastify/session`'s own `onSend` hook refuses to ever emit a
      #    `Secure`-flagged cookie unless the actual connection it saw was TLS (`request.protocol ===
      #    'https'`) -- which a bare `node backend` over plain HTTP never is, loopback or not -- so
      #    login silently never sets a cookie at all on that setup (OpenProject bug report, 2026-08-31).
      #    Set this to `false` for a local dev instance reached over plain HTTP with no TLS anywhere in
      #    the chain: it drops both `Secure` and the `__Host-` prefix from the session cookie name
      #    (`helpers/security.ts#sessionCookieName()`) so the plugin actually issues it. Leave it `true`
      #    (the default) for any real deployment -- this does NOT auto-detect loopback, so flipping it
      #    on a network-reachable instance really does remove the hardening task 2109 added.
      cookieSecure: true
      enforceHsts: false
      hstsDuration: 0
      # -> A known-good starting point for `enforceCsp`, not enabled by default (WP #2158/#2154): the
      #    admin area's `cspDirectivesHint` requires at least one directive once enforcement is turned
      #    on, and an operator with nothing to start from was previously left to author one from
      #    scratch. `object-src`/`base-uri`/`frame-ancestors` are the "at minimum" baseline; the rest
      #    is sized to what the app itself actually needs:
      #      - `script-src 'self'` / `worker-src 'self' blob:` -- Monaco's language workers
      #        (`frontend/src/boot/monaco.js`) and the custom-blocks loader (`/_blocks/**`) are both
      #        same-origin; `blob:` covers a worker Monaco spins up via an object URL rather than a
      #        same-origin script URL, which some of its language services still do internally.
      #      - `style-src 'self' 'unsafe-inline'` -- KaTeX (`frontend/src/renderers/markdown.js`)
      #        renders every expression as a tree of inline `style="..."` attributes; there is no
      #        practical nonce/hash story for content an editor can retype at any time.
      #      - `img-src 'self' data: https:` / `connect-src 'self' https:` -- `block-kroki` and
      #        `block-plantuml` `fetch()` and `<img src>` an *admin-configured* diagram-rendering
      #        server (kroki.io / plantuml.com by default, but changeable per block instance), so the
      #        host can't be pinned to one name; `data:` covers KaTeX/icon-inlined images.
      #      - `frame-src 'self' https:` -- `block-youtube`/`block-vimeo`/`block-dailymotion`/
      #        `block-m365-video` each embed a provider iframe; the exact host is either fixed per
      #        block or, for m365, entirely operator-supplied.
      #      - `font-src 'self' data:` -- KaTeX's bundled webfonts.
      #    Deliberately NOT covered: theme HTML injection (`site.theme.injectHead`/`injectBody`, an
      #    operator-authored inline `<script>`/`<style>`) and the `google`/`gtm`/`matomo` analytics
      #    modules, which each load a script from their own external origin -- both need directives
      #    this default can't guess in advance, called out in `AdminSecurity.vue`'s CSP hint instead
      #    of silently widened for here. See `docs/audit-2026-08-24/security/08-frontend-client.md`
      #    §10 and the co-located `backend/helpers/security.test.ts` case asserting this parses as
      #    expected.
      cspDirectives: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      uploadScanSVG: true
      disallowIframe: true
      uploadMaxFileSize: 10485760
      forceAssetDownload: true
      disallowOpenRedirect: true
      enforceSameOriginReferrerPolicy: true
      authRateLimitEnabled: true
      authRateLimitMax: 10
      authRateLimitWindow: '2m'
      authRateLimitBan: '15m'
      apiRateLimitEnabled: true
      apiRateLimitMax: 300
      apiRateLimitWindow: '5m'
      apiRateLimitBan: '15m'
      # Off by default: every headless Chromium launch (page re-render, PDF export, diagram render)
      # runs sandboxed. Set true only when the deployment environment cannot give Chromium its own
      # sandbox (typically a container without the setuid helper) -- this drops Chromium's own process
      # sandbox for every one of those launches, including the two that render attacker-influenced
      # content (a live page view with the requester's session cookie, and POSTed Mermaid source).
      allowPuppeteerNoSandbox: false
    flags:
      experimental: false
      authDebug: false
      sqlLog: false
    userDefaults:
      timezone: 'America/New_York'
      dateFormat: 'YYYY-MM-DD'
      timeFormat: '12h'
    update:
      # Whether the daily updateLocales scheduled job is allowed to pull the latest strings from
      # requarks/wiki-locales. Set to false to disable automatic locale syncing.
      locales: true
    # Base URL for this fork's own documentation, prepended to every in-app "view docs" / help link
    # (`siteStore.docsBase` on the frontend). Matches README.md's own Documentation link -- keep the
    # two in sync if this ever changes.
    docsBase: 'https://beta.js.wiki/docs'
    # Settings when running in dev mode only -- read directly off WIKI.config.dev by core/db.ts
    # (dropSchema, logQueries) and by frontend/vite.config.js (port, hmrClientPort) for its dev-server
    # proxy target. Declared here so config.sample.yml's `dev:` block (which every dev checkout ships)
    # has a schema counterpart -- without one, `warnUnknownConfigKeys()` flagged it as unrecognized on
    # every single dev boot.
    dev:
      dropSchema: false
      logQueries: false
      port: 3001
      hmrClientPort: 3001
systemIds:
  localAuthId: '5a528c4c-0a82-4ad2-96a5-2b23811e6588'
  guestsGroupId: '10000000-0000-4000-8000-000000000001'
  usersGroupId: '20000000-0000-4000-8000-000000000002'
  classificationPublicId: '30000000-0000-4000-8000-000000000001'
  classificationInternalId: '30000000-0000-4000-8000-000000000002'
  classificationRestrictedId: '30000000-0000-4000-8000-000000000003'
groups:
  defaultPermissions:
    - 'read:pages'
    - 'read:assets'
    - 'read:comments'
    - 'write:comments'
  defaultRules:
    - name: Default Rule
      mode: ALLOW
      match: START
      roles:
        - 'read:pages'
        - 'read:assets'
        - 'read:comments'
        - 'write:comments'
      path: ''
      locales: []
      sites: []
