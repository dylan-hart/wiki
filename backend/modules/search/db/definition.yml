key: db
title: 'Database'
icon: '/_assets/icons/ultraviolet-database.svg'
description: 'PostgreSQL full-text search. Every site starts with it, and it is the only search engine guaranteed to work: it cannot be disabled, so a site can always be searched even with no external engine configured.'
vendor: 'Cardinal.js'
website: 'https://github.com/dylan-hart/wiki'
props:
  termHighlighting:
    type: Boolean
    title: Term Highlighting
    hint: Show a highlighted excerpt with matched terms alongside each search result.
    icon: search
    default: false
# dictOverrides (a locale -> PostgreSQL text search dictionary map, e.g. { "en": "english" }) is
# deliberately not a prop: parseModuleProps only validates scalars, not an object with an arbitrary
# set of locale keys. It stays a free-form JSON config field the module reads off its stored config,
# and AdminSearch.vue edits it in a code editor rather than a generated form field.
