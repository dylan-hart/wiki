key: okta
title: Okta
description: Sign in with an Okta organization.
author: requarks.io
logo: https://static.requarks.io/logo/okta.svg
icon: /_assets/icons/ultraviolet-okta.svg
color: blue
vendor: 'Okta, Inc.'
website: 'https://developer.okta.com/docs/guides/implement-oauth-for-okta/'
isAvailable: true
useForm: false
usernameType: email
props:
  orgUrl:
    type: String
    title: Org URL
    hint: The Okta org's base URL, e.g. https://your-org.okta.com. Also the issuer — everything else is discovered from it.
    icon: internet
    order: 1
  clientId:
    type: String
    title: Client ID
    hint: From the OIDC application's General settings.
    icon: key
    order: 2
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same OIDC application.
    icon: password
    sensitive: true
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups).
    icon: user-groups
    default: false
    order: 4
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships. Requires a Groups claim added to the authorization server's ID token, under Security > API > Authorization Servers > your server > Claims.
    icon: user-groups
    default: 'groups'
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends. Okta gates group membership behind a custom auth-server scope, conventionally named `groups`, that has to exist and be requested before the claim above is populated.
    icon: rules
    default: 'groups'
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
  trustEmailForLinking:
    type: Boolean
    title: Trust This Provider's Email Addresses For Account Linking
    hint: Off by default. A returning login is normally accepted only when the account's stored link to this strategy already matches the profile Okta reports — an address match alone does not reopen an unlinked account, or one linked to a different Okta account. Turn this on only for an org whose addresses this instance trusts enough to link an existing account by address alone on first sign-in.
    icon: link
    default: false
    order: 7
refs:
  callbackUrl:
    title: Sign-in Redirect URI
    hint: Add this to the OIDC application's Sign-in redirect URIs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
