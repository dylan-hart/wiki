key: discord
title: Discord
description: Sign in with a Discord account.
author: requarks.io
logo: https://static.requarks.io/logo/discord.svg
icon: /_assets/icons/ultraviolet-discord.svg
color: indigo
vendor: 'Discord Inc.'
website: 'https://docs.discord.com/developers/topics/oauth2'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the application registered in the Discord Developer Portal.
    icon: key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same application.
    icon: password
    sensitive: true
    order: 2
  guildId:
    type: String
    title: Restrict to Server ID
    hint: >-
      (optional) A Discord guild/server ID. Only its members may sign in — checked against the
      authenticated user's own guild list, so the application must also request the `guilds` scope
      (added automatically here whenever this is set).
    icon: user-groups
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, never a privileged manage:system or root administrators group, and never a group outside this strategy's Mappable Groups allow-list — an empty allow-list means this changes no memberships at all). Discord's `/users/@me` reports no group/role claim of its own — mapping a server's roles would need a bot token this module doesn't use — so leave this off unless a custom OAuth2 proxy in front of Discord is adding one.
    icon: user-groups
    default: false
    order: 4
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which field of the user info response carries the user's group/role memberships.
    icon: user-groups
    default: 'groups'
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: OAuth2 Redirect URL
    hint: Add this to the application's OAuth2 Redirects.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
