key: discord
title: Discord
description: Sign in with a Discord account.
author: requarks.io
logo: https://static.requarks.io/logo/discord.svg
icon: /_assets/icons/ultraviolet-discord.svg
color: indigo
vendor: 'Discord Inc.'
website: 'https://docs.discord.com/developers/topics/oauth2'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the application registered in the Discord Developer Portal.
    icon: tabler:key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same application.
    icon: tabler:password
    sensitive: true
    order: 2
  guildId:
    type: String
    title: Restrict to Server ID
    hint: >-
      (optional) A Discord guild/server ID. Only its members may sign in — checked against the
      authenticated user's own guild list, so the application must also request the `guilds` scope
      (added automatically here whenever this is set).
    icon: tabler:users
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with their Discord roles on every login, limited to groups selected in the Mappable Groups allow-list below — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, and never a group carrying manage:system or the root administrators group, regardless of the allow-list; an empty allow-list means this changes no memberships at all). Roles are read by a bot in the server named by Restrict to Server ID, using the Bot Token below, so both must be set. Roles are matched to wiki groups by role name.
    icon: tabler:users
    default: false
    order: 4
  botToken:
    type: String
    title: Bot Token
    hint: The token of a bot added to the server named above. It needs no permissions beyond being a member of that server.
    icon: tabler:password
    sensitive: true
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: OAuth2 Redirect URL
    hint: Add this to the application's OAuth2 Redirects.
    icon: tabler:arrow-back
    value: '{host}/_api/auth/{id}/callback'
