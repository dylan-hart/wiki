key: twitch
title: Twitch
description: Sign in with a Twitch account.
author: requarks.io
logo: https://static.requarks.io/logo/twitch.svg
icon: /_assets/icons/ultraviolet-twitch.svg
color: purple
vendor: 'Twitch Interactive, Inc.'
website: 'https://dev.twitch.tv/docs/authentication/getting-tokens-oidc/'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the application registered in the Twitch Developer Console.
    icon: key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same application.
    icon: password
    sensitive: true
    order: 2
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups). Twitch has no concept of organizations or roles to source this from, so leave this off unless a custom Twitch extension is adding a claim of its own.
    icon: user-groups
    default: false
    order: 3
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships.
    icon: user-groups
    default: 'groups'
    order: 4
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends, if the claim above needs one.
    icon: rules
    default: ''
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
  trustEmailForLinking:
    type: Boolean
    title: Trust This Provider's Email Addresses For Account Linking
    hint: Off by default. A returning login is normally accepted only when the account's stored link to this strategy already matches the profile Twitch reports — an address match alone does not reopen an unlinked account, or one linked to a different Twitch account. Turn this on only for a deployment whose Twitch addresses this instance trusts enough to link an existing account by address alone on first sign-in.
    icon: link
    default: false
    order: 6
refs:
  callbackUrl:
    title: OAuth Redirect URL
    hint: Add this to the application's OAuth Redirect URLs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
