key: twitch
title: Twitch
description: Sign in with a Twitch account.
author: requarks.io
logo: https://static.requarks.io/logo/twitch.svg
icon: /_assets/icons/ultraviolet-twitch.svg
color: purple
vendor: 'Twitch Interactive, Inc.'
website: 'https://dev.twitch.tv/docs/authentication/getting-tokens-oidc/'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the application registered in the Twitch Developer Console.
    icon: key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same application.
    icon: password
    sensitive: true
    order: 2
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login, limited to groups selected in the Mappable Groups allow-list below — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, and never a group carrying manage:system or the root administrators group, regardless of the allow-list; an empty allow-list means this changes no memberships at all). Twitch has no concept of organizations or roles to source this from, so leave this off unless a custom Twitch extension is adding a claim of its own.
    icon: user-groups
    default: false
    order: 3
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships.
    icon: user-groups
    default: 'groups'
    order: 4
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends, if the claim above needs one.
    icon: rules
    default: ''
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: OAuth Redirect URL
    hint: Add this to the application's OAuth Redirect URLs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
