key: auth0
title: Auth0
description: Sign in with an Auth0 tenant.
author: requarks.io
logo: https://static.requarks.io/logo/auth0.svg
icon: /_assets/icons/ultraviolet-auth0.svg
color: deep-orange
vendor: 'Okta, Inc.'
website: 'https://auth0.com/docs/authenticate/protocols/openid-connect-protocol'
isAvailable: true
useForm: false
usernameType: email
props:
  domain:
    type: String
    title: Domain
    hint: The tenant domain, e.g. something.auth0.com. The issuer and every endpoint are discovered from it.
    icon: internet
    order: 1
  clientId:
    type: String
    title: Client ID
    hint: From the Auth0 application's settings.
    icon: key
    order: 2
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same Auth0 application.
    icon: password
    sensitive: true
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups).
    icon: user-groups
    default: false
    order: 4
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships. Auth0 reports no such claim by default — add an Action on the Login flow that sets a custom claim (e.g. `https://yourapp.example/groups`) from `event.authorization.roles` or the user's `app_metadata`, and name it here.
    icon: user-groups
    default: 'groups'
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends, if the Action above gates the claim behind one. Auth0's own claim-injecting Actions typically need none.
    icon: rules
    default: ''
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Allowed Callback URL
    hint: Add this to the Auth0 application's Allowed Callback URLs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
