key: gitlab
title: GitLab
description: Sign in with a GitLab.com or self-hosted GitLab account.
author: requarks.io
logo: https://static.requarks.io/logo/gitlab.svg
icon: /_assets/icons/ultraviolet-gitlab.svg
color: orange
vendor: 'GitLab Inc.'
website: 'https://docs.gitlab.com/ee/integration/openid_connect_provider.html'
isAvailable: true
useForm: false
usernameType: email
props:
  baseUrl:
    type: String
    title: Instance URL
    hint: (optional) A self-hosted GitLab instance's base URL, e.g. https://gitlab.example.com. Leave as the default for gitlab.com.
    icon: internet
    default: 'https://gitlab.com'
    order: 1
  clientId:
    type: String
    title: Application ID
    hint: From the GitLab application's settings.
    icon: key
    order: 2
  clientSecret:
    type: String
    title: Secret
    hint: From the same GitLab application.
    icon: password
    sensitive: true
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login, limited to groups selected in the Mappable Groups allow-list below — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, and never a group carrying manage:system or the root administrators group, regardless of the allow-list).
    icon: user-groups
    default: false
    order: 4
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's GitLab group memberships (full paths, e.g. `my-org/my-team`, not display names — wiki group names have to match those paths). Newer GitLab versions may report this under `groups_direct` instead.
    icon: user-groups
    default: 'groups'
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends, if a self-hosted instance gates the claim behind one. gitlab.com includes it under the standard `openid` scope.
    icon: rules
    default: ''
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Redirect URI
    hint: Add this to the GitLab application's Redirect URIs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
