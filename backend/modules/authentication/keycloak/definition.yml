key: keycloak
title: Keycloak
description: Sign in with a self-hosted Keycloak realm.
author: requarks.io
logo: https://static.requarks.io/logo/keycloak.svg
icon: /_assets/icons/ultraviolet-keycloak.svg
color: red
vendor: 'Keycloak (CNCF)'
website: 'https://www.keycloak.org/securing-apps/oidc-layers'
isAvailable: true
useForm: false
usernameType: email
props:
  baseUrl:
    type: String
    title: Base URL
    hint: This is the self-hosted preset — point it at your own Keycloak install's base URL, e.g. https://sso.example.com. No hosted default is offered because there isn't one.
    icon: internet
    order: 1
  realm:
    type: String
    title: Realm
    hint: The realm this wiki signs into, e.g. wiki. Together with the base URL this is the issuer, e.g. https://sso.example.com/realms/wiki.
    icon: building
    order: 2
  clientId:
    type: String
    title: Client ID
    hint: From the realm's client settings.
    icon: key
    order: 3
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same client's Credentials tab (requires the client's access type to be confidential).
    icon: password
    sensitive: true
    order: 4
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, never a privileged manage:system or root administrators group, and never a group outside this strategy's Mappable Groups allow-list — an empty allow-list means this changes no memberships at all).
    icon: user-groups
    default: false
    order: 5
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships. Requires the realm's `groups` client scope assigned to this client, with a group-membership mapper enabled on it.
    icon: user-groups
    default: 'groups'
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends. Keycloak's own `groups` client scope, when added as optional rather than default, has to be requested by name before the claim above is populated.
    icon: rules
    default: 'groups'
    order: 7
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Valid Redirect URI
    hint: Add this to the client's Valid Redirect URIs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
