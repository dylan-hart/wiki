key: google
title: Google
description: >-
  Sign in with a Google account or a Google Workspace domain. Plain Google sign-in carries no group
  membership. For group-based sync, either turn on Map Groups below (reads the user's Workspace
  groups through the Directory API with a service account) or configure a custom SAML app in Google
  Workspace's admin console (Apps → Web and mobile apps → Add custom SAML app, with a group attribute
  mapped under its Attribute mapping step) and use the SAML 2.0 module against it instead.
author: requarks.io
logo: https://static.requarks.io/logo/google.svg
icon: /_assets/icons/ultraviolet-google.svg
color: red-6
vendor: 'Google LLC'
website: 'https://developers.google.com/identity/openid-connect/openid-connect'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the OAuth 2.0 Client ID created in the Google Cloud console.
    icon: tabler:key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same OAuth 2.0 Client ID.
    icon: tabler:password
    sensitive: true
    order: 2
  hostedDomain:
    type: String
    title: Restrict to Workspace Domain
    hint: (optional) A Workspace domain, e.g. example.com. Only accounts on it may sign in — checked here as well as asked for, since the parameter alone is a hint to Google rather than a guarantee.
    icon: tabler:map-pin
    order: 3
  allowUnverifiedEmail:
    type: Boolean
    title: Accept Unverified Addresses
    hint: Off by default. A Google account whose address is unverified proves nothing about the mailbox, and an account here is matched on the address.
    icon: tabler:mail-check
    default: false
    order: 4
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with their Google Workspace groups (matched by group name) on every login, limited to groups selected in the Mappable Groups allow-list below — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, and never a group carrying manage:system or the root administrators group, regardless of the allow-list; an empty allow-list means this changes no memberships at all). Requires a Google Cloud service account with domain-wide delegation granted in the Workspace admin console (Security → Access and data control → API controls → Domain-wide delegation) for the scope https://www.googleapis.com/auth/admin.directory.group.readonly, the Admin SDK API enabled on its project, and a Workspace admin account for it to impersonate. If Google cannot be reached or refuses the lookup, the sign-in fails rather than changing any memberships.
    icon: user-groups
    default: false
    order: 5
  serviceAccountKey:
    type: String
    title: Service Account Key
    hint: The full JSON key file of the service account, pasted as-is. The account must have domain-wide delegation granted for the admin.directory.group.readonly scope in the Workspace admin console.
    icon: password
    sensitive: true
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
  delegatedAdminEmail:
    type: String
    title: Admin Account to Impersonate
    hint: A Workspace administrator's email address, e.g. admin@example.com. The service account impersonates it (domain-wide delegation) to read group membership, so it must be allowed to view groups in the Directory.
    icon: user
    order: 7
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Authorized Redirect URI
    hint: Add this to the OAuth client's authorized redirect URIs in the Google Cloud console.
    icon: tabler:arrow-back
    value: '{host}/_api/auth/{id}/callback'
