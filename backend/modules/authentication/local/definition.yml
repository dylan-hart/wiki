key: local
title: Local Database
description: Built-in authentication for Cardinal.js
author: requarks.io
logo: https://static.requarks.io/logo/wikijs.svg
icon: /_assets/icons/ultraviolet-data-protection.svg
color: primary
vendor: 'Cardinal.js'
website: 'https://github.com/dylan-hart/wiki'
isAvailable: true
useForm: true
usernameType: email
props:
  enforceTfa:
    type: Boolean
    title: Enforce Two-Factor Authentication
    hint: Users will be required to set up 2FA the first time they login, and cannot turn it off afterwards.
    icon: tabler:shield-check
    default: false
  emailValidation:
    type: Boolean
    title: Email Validation
    hint: Send a verification email to the user with a validation link when registering (if registration is enabled).
    icon: tabler:mail-check
    default: true
  allowForgotPassword:
    type: Boolean
    title: Allow Forgot Password
    hint: Users who have forgotten their password can request a reset link by email from the login screen. Turn this off where passwords are handed out rather than chosen.
    icon: tabler:lock-open
    default: true
  allowPasswordChange:
    type: Boolean
    title: Allow Password Change
    hint: Users can change their own password from their profile. Turn this off where passwords are managed by an administrator. A forced change at login and a password reset by email are not affected.
    icon: tabler:key
    default: true
