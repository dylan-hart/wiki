key: microsoft
title: Microsoft
description: Sign in with a Microsoft account, via Azure AD / Entra ID.
author: requarks.io
logo: https://static.requarks.io/logo/microsoft.svg
icon: /_assets/icons/ultraviolet-microsoft.svg
color: blue-7
vendor: 'Microsoft Corporation'
website: 'https://learn.microsoft.com/en-us/entra/identity-platform/v2-protocols-oidc'
isAvailable: true
useForm: false
usernameType: email
props:
  tenantId:
    type: String
    title: Tenant ID
    hint: Required. A directory (tenant) ID or verified domain from the app registration's Overview page. There is no multi-tenant ("common") option -- Microsoft's own OIDC library resolves the login's own tenant from the token itself rather than validating it against this value, so leaving it open would accept a token from any Microsoft tenant, not just this one.
    icon: building
    required: true
    order: 1
  clientId:
    type: String
    title: Application (client) ID
    hint: From the app registration's Overview page.
    icon: key
    order: 2
  clientSecret:
    type: String
    title: Client Secret
    hint: From the app registration's Certificates & secrets page.
    icon: password
    sensitive: true
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login, limited to groups selected in the Mappable Groups allow-list below — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, and never a group carrying manage:system or the root administrators group, regardless of the allow-list).
    icon: user-groups
    default: false
    order: 4
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships. Requires "groups" assigned or all under Token configuration > Add groups claim on the app registration; by default Microsoft reports the groups a user belongs to as GUIDs, not names, so wiki group names must match those GUIDs unless the app registration is set to emit group display names instead.
    icon: user-groups
    default: 'groups'
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends. Left empty by default — Microsoft's groups claim is governed by the app registration's Token configuration, not by scope.
    icon: rules
    default: ''
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Redirect URI
    hint: Add this as a Web platform Redirect URI on the app registration.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
