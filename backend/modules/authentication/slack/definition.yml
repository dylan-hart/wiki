key: slack
title: Slack
description: Sign in with a Slack account.
author: requarks.io
logo: https://static.requarks.io/logo/slack.svg
icon: /_assets/icons/ultraviolet-slack.svg
color: green
vendor: 'Slack Technologies, LLC'
website: 'https://docs.slack.dev/authentication/sign-in-with-slack/'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the Slack app's Basic Information page.
    icon: key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same Slack app.
    icon: password
    sensitive: true
    order: 2
  teamId:
    type: String
    title: Restrict to Workspace ID
    hint: >-
      (optional) A Slack workspace/team ID, e.g. T0123456. Only that workspace's members may sign in,
      and a member already signed into it skips the consent screen.
    icon: user-groups
    order: 3
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: Reconcile a user's wiki groups with the claim reported below on every login — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, never a privileged manage:system or root administrators group, and never a group outside this strategy's Mappable Groups allow-list — an empty allow-list means this changes no memberships at all). Slack's OIDC userinfo carries no group/role claim of its own, so leave this off unless a custom Slack app is adding one.
    icon: user-groups
    default: false
    order: 4
  groupsClaim:
    type: String
    title: Groups Claim
    hint: Which claim carries the user's group memberships.
    icon: user-groups
    default: 'groups'
    order: 5
    if:
      - { key: 'mapGroups', eq: true }
  groupsScope:
    type: String
    title: Groups Scope
    hint: (optional) A scope to request in addition to the fixed ones this preset already sends, if the claim above needs one.
    icon: rules
    default: ''
    order: 6
    if:
      - { key: 'mapGroups', eq: true }
refs:
  callbackUrl:
    title: Redirect URL
    hint: Add this to the Slack app's OAuth & Permissions redirect URLs.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
