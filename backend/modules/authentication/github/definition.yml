key: github
title: GitHub
description: Sign in with a GitHub account, on github.com or a GitHub Enterprise Server.
author: requarks.io
logo: https://static.requarks.io/logo/github.svg
icon: /_assets/icons/ultraviolet-github.svg
color: dark-4
vendor: 'GitHub, Inc.'
website: 'https://docs.github.com/en/apps/oauth-apps'
isAvailable: true
useForm: false
usernameType: email
props:
  clientId:
    type: String
    title: Client ID
    hint: From the OAuth app registered under Developer settings.
    icon: key
    order: 1
  clientSecret:
    type: String
    title: Client Secret
    hint: From the same OAuth app.
    icon: password
    sensitive: true
    order: 2
  enterpriseHost:
    type: String
    title: GitHub Enterprise Host
    hint: (optional) Hostname of a GitHub Enterprise Server, e.g. github.example.com. Leave empty for github.com.
    icon: server
    order: 3
  allowedOrganization:
    type: String
    title: Restrict to Organization
    hint: (optional) Login name of a GitHub organization. Only its members may sign in — which needs the account to be a public member, or the OAuth app to be approved by the organization.
    icon: user-groups
    order: 4
  mapGroups:
    type: Boolean
    title: Map Groups
    hint: >-
      Reconcile a user's wiki groups with their GitHub team memberships on every login, limited to groups selected in the Mappable Groups allow-list below — adding what is newly reported and removing what is no longer reported (never the guests group, never a group also granted by Auto Enroll Groups, and never a group carrying manage:system or the root administrators group, regardless of the allow-list; an empty allow-list means this changes no memberships at all).
      Teams are reported as `org/team-slug` names, which is what the allow-list matches. Needs the `read:org` scope. An organization with OAuth app access restrictions must approve this app, or its teams are invisible. GitHub Enterprise Server behaves per its own version.
    icon: user-groups
    default: false
    order: 5
refs:
  callbackUrl:
    title: Authorization Callback URL
    hint: Set this as the OAuth app's callback URL on GitHub.
    icon: back
    value: '{host}/_api/auth/{id}/callback'
