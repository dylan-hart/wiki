key: cas
title: CAS
description: Sign in through a CAS (Central Authentication Service) server.
author: requarks.io
logo: https://static.requarks.io/logo/cas.svg
icon: /_assets/icons/ultraviolet-key.svg
color: teal-8
vendor: 'Apereo Foundation'
website: 'https://apereo.github.io/cas/'
isAvailable: true
useForm: false
usernameType: email
props:
  casUrl:
    type: String
    title: CAS Server URL
    hint: The CAS server's own base URL, including its context path, e.g. https://cas.example.com/cas.
    icon: internet
    default: ''
    order: 1
  casVersion:
    type: String
    title: CAS Version
    hint: The CAS protocol version this server answers with — CAS 3.0 is the only supported version, since it is the version that reports attributes, which the mappings below read from.
    icon: fingerprint-scan
    enum:
      - CAS3.0|CAS 3.0
    default: 'CAS3.0'
    order: 2
  uniqueIdAttribute:
    type: String
    title: Unique ID Attribute
    hint: (optional) The CAS attribute holding the user's unique identifier. Falls back to the CAS username when left empty, or when the attribute is absent from what CAS reports.
    icon: fingerprint-scan
    default: ''
    order: 3
  emailAttribute:
    type: String
    title: Email Attribute
    hint: The CAS attribute holding the user's email address.
    icon: envelope
    default: 'mail'
    order: 4
  displayNameAttribute:
    type: String
    title: Display Name Attribute
    hint: (optional) The CAS attribute holding the user's display name. Falls back to the CAS username when left empty, or when the attribute is absent from what CAS reports.
    icon: person
    default: 'displayName'
    order: 5
refs:
  serviceUrl:
    title: Service URL
    hint: Register this as an allowed service with the CAS server above (a pattern match covering it is fine — the actual value this module sends is this URL plus a `?state=` parameter that changes on every login attempt).
    icon: back
    value: '{host}/_api/auth/{id}/callback'
