key: sharp
title: Sharp
description: >-
  Processes and transforms images. Required to generate thumbnails of uploaded images, and used to
  resize avatars and site assets such as logos.
website: 'https://sharp.pixelplumbing.com'
detect:
  type: module
  value: sharp
# Prebuilt binaries are published for these two on every platform sharp supports, so no separate
# `platforms` restriction is needed. Other architectures have builds too, but are not ones this
# project supports.
architectures:
  - x64
  - arm64
# Installing from the admin area is also how a native binary that is missing, or does not match this
# OS and architecture, is replaced.
isInstallable: true
