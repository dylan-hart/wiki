key: puppeteer
title: Puppeteer
description: >-
  Headless Chromium browser. Required to export pages as PDF and to pre-render Mermaid diagrams to a
  static image server-side. Installing it downloads a Chromium build of a few hundred megabytes,
  unless the server already provides one through PUPPETEER_EXECUTABLE_PATH.
website: 'https://pptr.dev'
detect:
  type: module
  value: puppeteer
# Chrome for Testing, the Chromium build @puppeteer/browsers downloads on install, has no ia32 or
# loong64 build at all — listing either here would offer an install that can only fail.
architectures:
  - x64
  - arm64
# @puppeteer/browsers' detectBrowserPlatform() recognizes only these three; anything else makes the
# postinstall download throw. On native Linux arm64 it still resolves to the x64 `linux64` build,
# since Chrome for Testing ships no Linux arm64 one — which is why dev/build/Dockerfile installs
# distro Chromium and sets PUPPETEER_SKIP_DOWNLOAD/PUPPETEER_EXECUTABLE_PATH. An operator installing
# by hand on a bare Linux arm64 host needs to do the same.
platforms:
  - linux
  - darwin
  - win32
# A declared optional dependency, so an ordinary install already has it and `--omit=optional` leaves
# it out; installing from the admin area is how such an instance is repaired.
isInstallable: true
# No installVersion: the pin lives in backend/package.json, and a second one here could only drift.
