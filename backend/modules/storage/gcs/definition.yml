key: gcs
title: Google Cloud Storage
icon: '/_assets/icons/ultraviolet-google.svg'
banner: '/_assets/storage/gcs.jpg'
description: Google Cloud Storage is an online file storage web service for storing and accessing data on Google Cloud Platform infrastructure.
vendor: Alphabet Inc.
website: 'https://cloud.google.com'
assetDelivery:
  isStreamingSupported: true
  isDirectAccessSupported: true
  defaultStreamingEnabled: true
  defaultDirectAccessEnabled: true
  isReadThroughSupported: true
  defaultReadThroughEnabled: false
contentTypes:
  supportedTypes: ['images', 'documents', 'others', 'large']
  defaultTypesEnabled: ['images', 'documents', 'others', 'large']
  defaultLargeThreshold: '5MB'
versioning:
  isSupported: false
  defaultEnabled: false
supportedModes: [push]
defaultMode: push
schedule: false
props:
  accountName:
    type: String
    title: Project ID
    hint: The project ID from the Google Developer's Console (e.g. grape-spaceship-123).
    icon: tabler:id
    default: ''
    order: 1
  credentialsJSON:
    type: String
    title: JSON Credentials
    hint: Contents of the JSON credentials file for the service account having Cloud Storage permissions.
    icon: tabler:key
    default: ''
    multiline: true
    sensitive: true
    order: 2
  bucket:
    type: String
    title: Unique bucket name
    hint: The unique bucket name to create (e.g. wiki-johndoe).
    icon: tabler:box
    order: 3
  pathPrefix:
    type: String
    title: Path Prefix
    hint: Optional folder inside the bucket under which everything is stored, so keys become `<prefix>/<siteId>/...` (e.g. wiki/prod). It lets several instances or apps share one bucket, and lets an IAM policy be scoped to just this sub-path. Changing it on an existing target orphans objects already uploaded under the old prefix; they are not moved or deleted.
    icon: tabler:folder
    default: ''
    order: 4
  storageTier:
    type: String
    title: Storage Tier
    hint: Select the storage class to use when uploading new assets.
    icon: tabler:stack-2
    order: 5
    default: STANDARD
    enum:
      - STANDARD|Standard
      - NEARLINE|Nearline
      - COLDLINE|Coldline
      - ARCHIVE|Archive
  apiEndpoint:
    type: String
    title: API Endpoint
    hint: The API endpoint of the service used to make requests.
    icon: tabler:api
    default: storage.google.com
    order: 6
actions:
  exportAll:
    label: Export All DB Assets to GCS
    hint: Output all content from the DB to Google Cloud Storage, overwriting any existing data. If you enabled Google Cloud Storage after content was created or you temporarily disabled it, you'll want to execute this action to add the missing content.
    icon: tabler:upload
