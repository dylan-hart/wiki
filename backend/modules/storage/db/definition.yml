key: db
title: 'Database'
icon: '/_assets/icons/ultraviolet-database.svg'
banner: '/_assets/storage/database.jpg'
description: 'The local PostgreSQL database can store any assets. It is however not recommended to store large files directly in the database as this can cause performance issues.'
vendor: 'Cardinal.js'
website: 'https://github.com/dylan-hart/wiki'
assetDelivery:
  isStreamingSupported: true
  isDirectAccessSupported: false
  defaultStreamingEnabled: true
  defaultDirectAccessEnabled: false
contentTypes:
  defaultTypesEnabled: ['pages', 'images', 'documents', 'others', 'large']
  defaultLargeThreshold: '5MB'
versioning:
  isSupported: true
  defaultEnabled: false
supportedModes: [push]
defaultMode: push
schedule: false
props: {}
actions:
  purge:
    label: Purge All Assets
    hint: Delete the stored bytes (not the metadata) of every asset that another enabled storage target can serve on its own - through Direct Access, or through Read-Through. Before deleting anything, each asset's copy in that target is checked against the database - it must exist and match the database copy in size and SHA-256 hash - and an asset whose copy fails the check is kept and reported as unverified. Assets no such target covers are left untouched. Useful if you moved assets to another storage target and want to reduce the size of the database.
    warn: This is a destructive action and cannot be undone! Only bytes whose copy was verified are deleted, but afterwards the target's bucket holds the only copy - a database-only backup will no longer contain these files. Verification reads every covered asset in full, so this can take a while on a large library.
    icon: tabler:bomb
