key: default
title: Cardinal.js Native
description: Built-in comments, stored in this wiki's own database.
icon: '/_assets/icons/ultraviolet-comments.svg'
vendor: Cardinal.js
website: 'https://js.wiki'
isAvailable: true
props:
  akismet:
    type: String
    sensitive: true
    default: ''
    title: Akismet API Key
    hint: 'Prevent spam by using the Akismet service. Enter your API key here to enable. Leave empty to disable.'
    order: 1
  minDelay:
    type: Number
    default: 30
    title: Post delay
    hint: 'Minimum delay (in seconds) between comments per account. Note that all guests are considered as a single account.'
    order: 2
