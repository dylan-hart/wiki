#######################################################################
# Wiki.js - CONFIGURATION                                             #
#######################################################################
# Full documentation + examples:
# https://next.js.wiki/docs/install

# ---------------------------------------------------------------------
# Environment variable substitution
# ---------------------------------------------------------------------
# Any string value in this file may reference an environment variable with
# $(ENV_VAR_NAME) or, with a fallback if that variable is unset,
# $(ENV_VAR_NAME:default). This is applied to the raw text of this file
# before it is parsed as YAML, so it works anywhere a string is expected
# (not just at the top level).
#
# Worked example — read the DB password from an env var, falling back to
# a value if it isn't set:
#   pass: $(WIKI_DB_PASS:postgres)

# ---------------------------------------------------------------------
# How configuration is assembled (three sources, in order)
# ---------------------------------------------------------------------
# 1. backend/base.yml    - system-wide file defaults. Not user-editable.
# 2. config.yml (this file, or $CONFIG_FILE) - your overrides of the above.
# 3. The `settings` database table - written by the admin area, and loaded
#    LAST at boot, so it wins over both files above for every key it owns.
#
# The DB owns entire top-level key groups outright (initially seeded from
# the "DB defaults" section of base.yml, then only ever updated through the
# admin area from that point on): `api`, `auditLog`, `auth`, `flags`,
# `icons`, `mail`, `metrics`, `pageviews`, `search`, `security`, `update`,
# `userDefaults`. Setting one of these keys in this file has no lasting
# effect once the instance has booted once — e.g. `security.trustProxy` is
# set on the admin Security page, never here.
#
# Everything else below (`port`, `db`, `bindIP`, `logLevel`, `pool`,
# `files`, `scheduler`, `offline`, `dataPath`, ...) is file-owned: this file
# overrides base.yml's default, and there is no DB row to override it back.

# ---------------------------------------------------------------------
# Port the server should listen to
# ---------------------------------------------------------------------

port: 3000

# ---------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------
# PostgreSQL 16 or later required

db:
  host: localhost
  port: 5432
  user: postgres
  pass: postgres
  db: postgres
  schema: wiki
  # -> This is the Postgres connection's own TLS setting, not application-level TLS for the wiki
  #    itself — Wiki.js never terminates HTTPS; see docs/tls-termination.md.
  ssl: false

  # Optional
  # -> Uncomment lines you need below and set `auto` to false
  # -> Full list of accepted options: https://nodejs.org/api/tls.html#tls_tls_createsecurecontext_options
  # -> Same scope note as `ssl` above: these configure the encrypted connection to Postgres, not
  #    the wiki's own HTTP(S) listener.
  sslOptions:
    auto: true
    # rejectUnauthorized: false
    # ca: path/to/ca.crt
    # cert: path/to/cert.crt
    # key: path/to/key.pem
    # pfx: path/to/cert.pfx
    # passphrase: xyz123

# ---------------------------------------------------------------------
# Postgres connection pool
# ---------------------------------------------------------------------
# `min`/`max` are the pool's minimum/maximum number of open connections;
# `connectionTimeoutMillis` is how long a request for a connection waits
# before failing, once the pool is fully saturated -- left unset, it waits
# indefinitely instead of failing fast. `statementTimeoutMillis` bounds how
# long a single query may run before Postgres cancels it, so a runaway query
# cannot hold a checked-out connection open indefinitely either.
#
# base.yml already sets min: 1, max: 20 (WP #2276 sized this at double
# node-postgres's own unmetered default of 10, to give a single instance
# headroom under a burst against any unmetered whole-table surface --
# sitemap/knowledge-graph generation, icon-set lookup -- without queuing
# logins behind it). Uncomment below only to override that default, e.g. a
# busy multi-worker deployment sharing a tighter Postgres connection limit.
#
# 3 connections are permanently held open for LISTEN, outside this pool's
# regular checkout/release cycle: the cross-instance event bus, the job
# scheduler, and collaborative editing. `max` needs headroom above that
# fixed cost, not just above your expected query concurrency.
#
# pool:
#   min: 1
#   max: 20
#   connectionTimeoutMillis: 5000
#   statementTimeoutMillis: 60000

#######################################################################
# ADVANCED OPTIONS                                                    #
#######################################################################
# Do not change unless you know what you are doing!

# ---------------------------------------------------------------------
# IP address the server should listen to
# ---------------------------------------------------------------------
# Leave 0.0.0.0 for all interfaces

bindIP: 0.0.0.0

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
# Every line is `<timestamp> <level> <scope>  <message>  <key=value ...>`;
# `scope` names the subsystem (db, http, jobs, storage, ...) and is what makes
# a grep useful. See docs/operations.md#logs for the full scope table.
#
# The threshold. Possible values: error, warn, info (default), debug
#   error  something is broken and a person has to act
#   warn   degraded, self-healing, or a configuration smell
#   info   a state change worth having in the record
#   debug  per-item, per-request, per-tick -- the access log, every job tick,
#          and the sqlLog / authDebug firehoses
# The 2.x levels `verbose` and `silly` do not exist here. Case-sensitive, and
# enforced: anything else refuses to start rather than quietly logging
# everything.

logLevel: info

# Output format, possible values: text, json
#   text  human-readable, coloured on a TTY -- for tailing one process
#   json  one object per line, with the instance id on every record -- for a
#         log shipper or an aggregator
# (`default` was this value's old name; there is no alias for it.)
# Enforced the same way as logLevel above.

logFormat: text

# There is no log FILE, by design: lines go to stdout and nowhere else, plus an
# in-memory ring buffer of the last 500 replayed to the admin log view.
# Capturing them durably is the operator's job. Per-scope thresholds
# (`logScopes:`) are planned but NOT a config key yet -- setting one today is an
# unknown key, not a quieter `http`.

# ---------------------------------------------------------------------
# Offline Mode
# ---------------------------------------------------------------------
# If your server cannot access the internet, set to true. This gates every
# outbound call an admin has not explicitly configured with its own remote
# endpoint (Iconify icon lookups, the daily version/locale update checks,
# server-side PlantUML rendering) — see docs/offline-deployment.md for the
# full audited list and the supported air-gapped deployment path.
#
# In the official container image this is also settable via the WIKI_OFFLINE
# environment variable, so a containerized/air-gapped deployment provisioned
# through env vars does not need to hand-edit this file.
#
# To add or update a locale pack without rebuilding or redeploying, drop a
# JSON file into <dataPath>/locales/ (see docs/offline-deployment.md) and
# either restart or POST /_api/locales/sideload as an admin.

offline: false

# ---------------------------------------------------------------------
# Data Path
# ---------------------------------------------------------------------
# Writeable data path used for cache, exports, and other on-disk working storage.
dataPath: ./data

# ---------------------------------------------------------------------
# File cache
# ---------------------------------------------------------------------
# How much of <dataPath>/cache/files served copies of uploaded files may
# take up, in bytes. Trimmed back oldest-first once exceeded. Set to 0 to
# serve every request from the database instead. Default (base.yml):
# 536870912 (512 MiB).
# files:
#   cacheMaxSize: 536870912

# ---------------------------------------------------------------------
# Icons
# ---------------------------------------------------------------------
# Icons are fetched from the Iconify API the first time they are used, then
# stored in the database and served by this instance. Point this at a
# self-hosted Iconify API to keep icon lookups inside your network.

icons:
  apiUrl: 'https://api.iconify.design'

# ---------------------------------------------------------------------
# Body Parser Limit
# ---------------------------------------------------------------------
# Maximum size of API requests body that can be parsed, in bytes.
# Does not affect file uploads. (default: 5242880 (5mb))

bodyParserLimit: 5242880

# ---------------------------------------------------------------------
# Scheduler
# ---------------------------------------------------------------------

scheduler:
  # Maximum number of workers to run background cpu-intensive jobs.
  # Leave 'auto' to use number of CPU cores as maximum.
  workers: auto

# ---------------------------------------------------------------------
# Automatic Updates
# ---------------------------------------------------------------------

update:
  # Whether the daily scheduled job is allowed to pull the latest locale
  # strings from https://github.com/requarks/wiki-locales. Set to false
  # to disable automatic locale syncing (e.g. offline instances).
  locales: true

# ---------------------------------------------------------------------
# Dev Mode
# ---------------------------------------------------------------------
# Settings when running in dev mode only

dev:
  dropSchema: false
  logQueries: false
  port: 3001
  hmrClientPort: 3001
