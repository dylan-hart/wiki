#######################################################################
# Cardinal.js - CONFIGURATION                                         #
#######################################################################
# Full documentation + examples:
# https://next.js.wiki/docs/install

# ---------------------------------------------------------------------
# Environment variable substitution
# ---------------------------------------------------------------------
# Any string value may reference an environment variable as $(ENV_VAR_NAME),
# or $(ENV_VAR_NAME:default) with a fallback when it is unset — e.g.
# `pass: $(WIKI_DB_PASS:postgres)`. Substitution runs on this file's raw text
# before it is parsed as YAML, so it works anywhere a string is expected.

# ---------------------------------------------------------------------
# How configuration is assembled (three sources, in order)
# ---------------------------------------------------------------------
# 1. backend/base.yml    - system-wide file defaults. Not user-editable.
# 2. config.yml (this file, or $CONFIG_FILE) - your overrides of the above.
# 3. The `settings` database table - written by the admin area, loaded LAST
#    at boot and deep-merged over both files above, key by key.
#
# So anything the admin area owns — `api`, `auditLog`, `auth`, `flags`,
# `mail`, `metrics`, `pageviews`, `replication`, `security`, `userDefaults` —
# cannot be set from this file: once the instance has booted once the stored
# row wins. `security.trustProxy`, for one, is set on the admin Security page
# and never here. Every key documented below is file-owned.

# ---------------------------------------------------------------------
# Port the server should listen to
# ---------------------------------------------------------------------

port: 3000

# ---------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------
# PostgreSQL 16 or later required

db:
  host: localhost
  port: 5432
  user: postgres
  pass: postgres
  db: postgres
  schema: wiki
  # -> This is the Postgres connection's own TLS setting, not application-level TLS for the wiki
  #    itself — Cardinal.js never terminates HTTPS; see docs/tls-termination.md.
  ssl: false

  # Optional
  # -> Uncomment lines you need below and set `auto` to false
  # -> Full list of accepted options: https://nodejs.org/api/tls.html#tls_tls_createsecurecontext_options
  sslOptions:
    auto: true
    # rejectUnauthorized: false
    # ca: path/to/ca.crt
    # cert: path/to/cert.crt
    # key: path/to/key.pem
    # pfx: path/to/cert.pfx
    # passphrase: xyz123

# ---------------------------------------------------------------------
# Postgres connection pool
# ---------------------------------------------------------------------
# `connectionTimeoutMillis` is how long a request for a connection waits once
# the pool is saturated before failing -- left unset, it waits indefinitely
# instead of failing fast. `statementTimeoutMillis` bounds how long a single
# query may run before Postgres cancels it, so a runaway query cannot hold a
# checked-out connection open indefinitely either.
#
# base.yml already sets min: 1, max: 20. Uncomment below only to override
# that, e.g. a busy multi-worker deployment sharing a tighter Postgres
# connection limit.
#
# 3 further connections are permanently held open for LISTEN in a separate
# pool (the cross-instance event bus, the job scheduler, and collaborative
# editing), so a Postgres connection limit has to cover `max` plus those.
#
# pool:
#   min: 1
#   max: 20
#   connectionTimeoutMillis: 5000
#   statementTimeoutMillis: 60000

#######################################################################
# ADVANCED OPTIONS                                                    #
#######################################################################
# Do not change unless you know what you are doing!

# ---------------------------------------------------------------------
# IP address the server should listen to
# ---------------------------------------------------------------------
# Leave 0.0.0.0 for all interfaces

bindIP: 0.0.0.0

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
# Every line names the subsystem it came from as its `scope` (db, http, jobs,
# storage, ...) -- see docs/operations.md#logs for the full scope table.
#
# The threshold. Possible values: error, warn, info (default), debug
#   error  something is broken and a person has to act
#   warn   degraded, self-healing, or a configuration smell
#   info   a state change worth having in the record
#   debug  per-item, per-request, per-tick -- the access log, every job tick,
#          and the sqlLog / authDebug firehoses
# Case-sensitive, and enforced: anything else refuses to start rather than
# quietly logging everything.

logLevel: info

# Output format, possible values: text, json
#   text  human-readable, coloured on a TTY -- for tailing one process
#   json  one object per line, with the instance id on every record -- for a
#         log shipper or an aggregator
# Enforced the same way as logLevel above.

logFormat: text

# There is no log FILE, by design: lines go to stdout and nowhere else (plus an
# in-memory ring buffer of the last 500, for the admin log view), so capturing
# them durably is the operator's job.

# Optional per-scope thresholds, setting the level for one scope alone --
# raising or quietening it -- while `logLevel` above stays the default for every
# scope that says nothing. Scope names come from the closed vocabulary in
# backend/core/logScopes.ts; an unknown scope or level refuses to start.
#
# The HTTP access log is a `debug http` line, so at the default `logLevel: info`
# there is no access log at all. This turns one on without also turning on every
# other per-request line in the server:
#
# logScopes:
#   http: debug
#   sql: error
#
# The `sqlLog` and `authDebug` admin flags are the live counterpart, raising
# `sql`/`auth` to debug without a restart. A flag wins over an entry here.

# ---------------------------------------------------------------------
# Slow query threshold
# ---------------------------------------------------------------------
# Milliseconds. 0 (the default) is off. Set a positive value and every query
# the main Postgres pool runs that takes at least that long emits one
# `warn sql slow query` line. Bound parameter VALUES are never logged -- only a
# type/length descriptor per parameter -- and the query text is truncated to its
# first 200 characters.
#
# The line is a `warn` on the `sql` scope, so `logScopes: { sql: error }`
# quietens it along with the firehose. It is a FILE setting, not one of the
# admin flags above, so changing it takes a restart.
#
# `pool.statementTimeoutMillis` (above, default 60000) is the hard ceiling at
# which Postgres CANCELS a query outright; `slowQueryMs` is the softer warning
# before it, so set it well under that -- 1000 or so on a healthy instance.
#
# Timing sits on the pool itself, so the boot-time migration runner is timed
# too: expect a burst of lines on the first boot after a large migration.

slowQueryMs: 0

# ---------------------------------------------------------------------
# Offline Mode
# ---------------------------------------------------------------------
# If your server cannot access the internet, set to true. This gates every
# outbound call an admin has not explicitly configured with its own remote
# endpoint (Iconify icon lookups, the daily version/locale update checks,
# server-side PlantUML rendering) — see docs/offline-deployment.md for the
# full audited list and the supported air-gapped deployment path. Also
# settable as the WIKI_OFFLINE env var in the official container image.
#
# To add or update a locale pack without rebuilding or redeploying, drop a
# JSON file into <dataPath>/locales/ and either restart or POST
# /_api/locales/sideload as an admin.

offline: false

# ---------------------------------------------------------------------
# Data Path
# ---------------------------------------------------------------------
# Writeable data path used for cache, exports, and other on-disk working storage.
dataPath: ./data

# ---------------------------------------------------------------------
# File cache
# ---------------------------------------------------------------------
# How much of <dataPath>/cache/files served copies of uploaded files may
# take up, in bytes. Trimmed back oldest-first once exceeded. Set to 0 to
# serve every request from the database instead. Default (base.yml):
# 536870912 (512 MiB).
# files:
#   cacheMaxSize: 536870912

# ---------------------------------------------------------------------
# Icons
# ---------------------------------------------------------------------
# Icons are fetched from the Iconify API the first time they are used, then
# stored in the database and served by this instance. Point this at a
# self-hosted Iconify API to keep icon lookups inside your network.

icons:
  apiUrl: 'https://api.iconify.design'

# ---------------------------------------------------------------------
# Body Parser Limit
# ---------------------------------------------------------------------
# Maximum size of API requests body that can be parsed, in bytes.
# Does not affect file uploads. (default: 5242880 (5mb))

bodyParserLimit: 5242880

# ---------------------------------------------------------------------
# Scheduler
# ---------------------------------------------------------------------

scheduler:
  # Maximum number of workers to run background cpu-intensive jobs.
  # Leave 'auto' to use number of CPU cores as maximum.
  workers: auto

# ---------------------------------------------------------------------
# Automatic Updates
# ---------------------------------------------------------------------

update:
  # Whether the daily scheduled job is allowed to pull the latest locale
  # strings from https://github.com/requarks/wiki-locales. Set to false
  # to disable automatic locale syncing (e.g. offline instances).
  locales: true
  releasesUrl: https://api.github.com/repos/dylan-hart/wiki/releases

# ---------------------------------------------------------------------
# Dev Mode
# ---------------------------------------------------------------------
# Settings when running in dev mode only

dev:
  dropSchema: false
  port: 3001
  hmrClientPort: 3001
