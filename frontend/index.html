<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/_site/current/favicon" />
    <link rel="manifest" href="/_site/current/manifest" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
    <title>Cardinal.js</title>
    <!--preload-links-->
    <!--
      Substituted by `src/build/temporalPolyfillChunk.js` with an inline script setting
      `window.__wikiTemporalPolyfillUrl` to the hashed build URL of temporal-polyfill's 'global.esm'
      chunk. That chunk is deliberately kept out of Vite's own modulepreload links so only a
      feature-detect script preloads it, for the browsers that actually need it. The placeholder
      must stay above the preload script so the URL is defined when it runs.
    -->
    <!--temporal-polyfill-chunk-url-->
    <!-- temporal-polyfill-preload:start
      Warms the `temporal-polyfill` chunk in parallel with the eager bundle for a browser lacking
      native `Temporal`. Without it, `main.js`'s top-level `await initializeTemporal()` reaches
      `boot/temporal.js`'s dynamic import only once the whole eager module graph has loaded and
      evaluated, costing an affected browser a full extra serialised round trip before it can mount.
      The feature detect is load-bearing: a browser with native `Temporal` must receive no link at
      all, rather than fetch ~20 KB gzipped it will never execute.
    -->
    <script>
      if (typeof globalThis.Temporal === 'undefined' && window.__wikiTemporalPolyfillUrl) {
        var temporalPolyfillPreload = document.createElement('link')
        temporalPolyfillPreload.rel = 'modulepreload'
        temporalPolyfillPreload.href = window.__wikiTemporalPolyfillUrl
        document.head.appendChild(temporalPolyfillPreload)
      }
    </script>
    <!-- temporal-polyfill-preload:end -->
    <script>
      function ignoreSkippedViewTransition(transition) {
        if (!transition) {
          return
        }
        var ignore = function () {}
        transition.ready.catch(ignore)
        transition.finished.catch(ignore)
      }
      function ignoreEventViewTransition(event) {
        ignoreSkippedViewTransition(event.viewTransition)
      }
      ignoreSkippedViewTransition(document.activeViewTransition)
      window.addEventListener('pagereveal', ignoreEventViewTransition)
      window.addEventListener('pageswap', ignoreEventViewTransition)
    </script>
    <!--
      No webfont is linked statically: which family applies (if any -- `theme.baseFont` /
      `theme.contentFont` can both be `'user'`, meaning "no override") is a per-site setting, known
      only once the site config has loaded, so `helpers/fonts.js`'s `applyFonts()` links the
      selected self-hosted stylesheets at runtime. Icon data is inlined at build time by
      `scripts/generate-icons.mjs`, so there is no icon webfont either.
    -->
    <style type="text/css">
      @keyframes initspinner {
        to {
          transform: rotate(360deg);
        }
      }

      .init-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.75);
        z-index: 2000000000;
        backdrop-filter: blur(10px);
      }

      .body--dark .init-loading {
        background-color: rgba(0, 0, 0, 0.75);
      }

      .init-loading:before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50px;
        height: 50px;
        margin-top: -25px;
        margin-left: -25px;
        border-radius: 50%;
        border-top: 2px solid #1976d2;
        border-right: 2px solid transparent;
        animation: initspinner 0.6s linear infinite;
        z-index: 2000000000;
      }
    </style>

    <noscript>
      <style type="text/css">
        .init-loading {
          display: none !important;
        }

        .q-drawer-container {
          display: none !important;
        }

        .scroll.relative-position {
          position: static !important;
        }

        .scroll.relative-position > .absolute {
          position: relative !important;
        }
      </style>
    </noscript>
  </head>
  <body class="wiki-root">
    <div class="init-loading"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
