<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/_site/current/favicon" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
    <title>Wiki.js</title>
    <!--preload-links-->
    <!--
      No webfont is linked statically here any more: which family (if any -- `theme.baseFont` /
      `theme.contentFont` can both be `'user'`, meaning "no override") is a per-site setting, only
      known once the site's config has loaded. `helpers/fonts.js`'s `applyFonts()`, called from
      `App.vue`'s `applyTheme()`, links only the stylesheet(s) actually selected -- self-hosted, from
      the same `/_assets/fonts/<key>/<key>.css` assets this used to load unconditionally for Roboto
      alone. Icon data is inlined at build time by scripts/generate-icons.mjs, so there is no icon
      webfont to load either.
    -->
    <style type="text/css">
      @keyframes initspinner {
        to {
          transform: rotate(360deg);
        }
      }

      .init-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.75);
        z-index: 2000000000;
        backdrop-filter: blur(10px);
      }

      .body--dark .init-loading {
        background-color: rgba(0, 0, 0, 0.75);
      }

      .init-loading:before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50px;
        height: 50px;
        margin-top: -25px;
        margin-left: -25px;
        border-radius: 50%;
        border-top: 2px solid #1976d2;
        border-right: 2px solid transparent;
        animation: initspinner 0.6s linear infinite;
        z-index: 2000000000;
      }
    </style>

    <noscript>
      <style type="text/css">
        .init-loading {
          display: none !important;
        }

        .q-drawer-container {
          display: none !important;
        }

        .scroll.relative-position {
          position: static !important;
        }

        .scroll.relative-position > .absolute {
          position: relative !important;
        }
      </style>
    </noscript>
  </head>
  <body class="wiki-root">
    <div class="init-loading"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
