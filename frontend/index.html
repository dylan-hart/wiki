<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/_site/current/favicon" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />
    <title>Cardinal.js</title>
    <!--preload-links-->
    <!-- temporal-polyfill-preload:start
      Feature-detects native `Temporal` support and, only when it's missing, starts fetching the
      `temporal-polyfill` chunk in parallel with the eager bundle instead of after it. Without this,
      `main.js`'s top-level `await initializeTemporal()` only reaches `boot/temporal.js`'s dynamic
      `import('temporal-polyfill/global')` once the whole eager module graph has already loaded and
      evaluated, so an affected browser (Safari, as of 2026-08-31 -- see WP #1828) pays a full extra
      round trip, serialised after the main bundle, before the app can mount. This script only warms
      the cache that dynamic import then hits; `main.js` and `boot/temporal.js` keep their current
      logic unchanged.

      `__TEMPORAL_POLYFILL_HREF__` is a placeholder. The chunk's real filename is content-hashed and
      only known post-build, so it can't be hand-written here -- the Vite plugin added by WP #1833
      substitutes this exact token with the real `assets/_assets/global.esm-<hash>.js` path via
      `transformIndexHtml`. Do not preload unconditionally: browsers with native `Temporal` must
      receive no such link, which is exactly what the guard below (and #1833 skipping the plugin's
      own unconditional-preload list for this chunk) ensures.
    -->
    <script>
      if (typeof globalThis.Temporal === 'undefined') {
        var temporalPolyfillPreload = document.createElement('link')
        temporalPolyfillPreload.rel = 'modulepreload'
        temporalPolyfillPreload.href = '__TEMPORAL_POLYFILL_HREF__'
        document.head.appendChild(temporalPolyfillPreload)
      }
    </script>
    <!-- temporal-polyfill-preload:end -->
    <!--
      Substituted by the `temporalPolyfillChunk` Vite plugin (`src/build/temporalPolyfillChunk.js`)
      with the real, hashed build URL of the temporal-polyfill 'global.esm' chunk, as an inline
      script setting `window.__wikiTemporalPolyfillUrl`. This never becomes a
      `<link rel="modulepreload">` here -- that chunk is deliberately absent from Vite's own
      modulepreload links, since preloading it for every browser would waste ~20 KB gzipped on
      browsers with native `Temporal`. It exists only so a feature-detect script can conditionally
      preload the chunk for browsers that still need it.
    -->
    <!--temporal-polyfill-chunk-url-->
    <!--
      No webfont is linked statically here any more: which family (if any -- `theme.baseFont` /
      `theme.contentFont` can both be `'user'`, meaning "no override") is a per-site setting, only
      known once the site's config has loaded. `helpers/fonts.js`'s `applyFonts()`, called from
      `App.vue`'s `applyTheme()`, links only the stylesheet(s) actually selected -- self-hosted, from
      the same `/_assets/fonts/<key>/<key>.css` assets this used to load unconditionally for Roboto
      alone. Icon data is inlined at build time by scripts/generate-icons.mjs, so there is no icon
      webfont to load either.
    -->
    <style type="text/css">
      @keyframes initspinner {
        to {
          transform: rotate(360deg);
        }
      }

      .init-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.75);
        z-index: 2000000000;
        backdrop-filter: blur(10px);
      }

      .body--dark .init-loading {
        background-color: rgba(0, 0, 0, 0.75);
      }

      .init-loading:before {
        content: '';
        box-sizing: border-box;
        position: absolute;
        top: 50%;
        left: 50%;
        width: 50px;
        height: 50px;
        margin-top: -25px;
        margin-left: -25px;
        border-radius: 50%;
        border-top: 2px solid #1976d2;
        border-right: 2px solid transparent;
        animation: initspinner 0.6s linear infinite;
        z-index: 2000000000;
      }
    </style>

    <noscript>
      <style type="text/css">
        .init-loading {
          display: none !important;
        }

        .q-drawer-container {
          display: none !important;
        }

        .scroll.relative-position {
          position: static !important;
        }

        .scroll.relative-position > .absolute {
          position: relative !important;
        }
      </style>
    </noscript>
  </head>
  <body class="wiki-root">
    <div class="init-loading"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
