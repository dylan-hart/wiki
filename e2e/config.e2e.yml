# Backend config for the Playwright e2e suite.
#
# No db: block on purpose: playwright.config.js starts the backend with DATABASE_URL set, which
# overrides every db.* connection field, so one here would either duplicate it or drift from it
# silently. db.schema still comes from base.yml's default ('wiki').
port: 3000
dataPath: ./data/e2e-test
scheduler:
  # -> Far below base.yml's default so a spec can observe a real `reapStaleJobs` sweep without a
  #    multi-minute wait. `pollingCheck` (job claiming) stays at its own default.
  scheduledCheck: 5
  # -> Short enough that a deliberately-backdated `active` row reads as stale inside a spec's own
  #    polling window, long enough that no genuinely-running seeded task is mistaken for one.
  staleJobTimeout: 20
security:
  # -> Off by default in `base.yml`, flipped on here so `csp.spec.js` runs against a genuinely
  #    enforced policy. It has to be set before the very first boot rather than toggled by a spec:
  #    `index.ts` reads it once, at server start, to register helmet's CSP plugin. `cspDirectives`
  #    is deliberately left unset, so the spec proves `base.yml`'s SHIPPED string rather than a
  #    copy duplicated here.
  enforceCsp: true
  # -> `base.yml`'s default is sized for a person signing in, not for a suite that submits the real
  #    login form dozens of times from one runner IP and one account -- enough to trip both the
  #    IP-keyed and account-keyed counters inside a single window, after which the ban outlasts the
  #    job and every later spec's login hangs on a 429 the frontend has no retry path for. Nothing
  #    here exercises the limiter itself; `backend/helpers/rateLimit.test.ts` does.
  authRateLimitEnabled: false
  # -> `base.yml`'s default marks the session cookie `Secure` and `__Host-`-prefixed, and a browser
  #    refuses to store a `Secure` cookie over plain HTTP -- which is all this suite speaks, no TLS
  #    anywhere in the chain. Left at the default, a login succeeds server-side while the browser
  #    drops the `Set-Cookie`, leaving every following request unauthenticated. `base.yml`
  #    documents this flag as the escape hatch for exactly that shape of deployment.
  cookieSecure: false
