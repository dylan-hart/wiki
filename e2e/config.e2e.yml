# Backend config for the Playwright e2e suite (see CLAUDE.md's "Testing (e2e)" section).
#
# playwright.config.js points the backend at this file via CONFIG_FILE and starts it with
# DATABASE_URL set, which overrides every db.* connection field base.yml would otherwise supply --
# except db.schema, which still comes from base.yml's default ('wiki'). That is why there is no
# db: block here: one would either duplicate what DATABASE_URL already carries or, worse, drift
# from it silently.
port: 3000
dataPath: ./data/e2e-test
scheduler:
  # -> Lowered from base.yml's 300s so `scheduler.spec.js` (task 581) can observe a real
  #    `reapStaleJobs` sweep -- an `active` history row planted with an old `startedAt` -- without
  #    a multi-minute wait. `pollingCheck` (job claiming) is left at its 5s default; only the
  #    schedule-replan/reap interval is sped up.
  scheduledCheck: 5
  # -> Lowered from base.yml's 3600s to the same end: short enough that a deliberately-backdated
  #    `active` row reads as stale within the test's own polling window, long enough that no
  #    genuinely-running seeded task (checkVersion, purgeRateLimits, ...) is ever mistaken for one.
  staleJobTimeout: 20
security:
  # -> Turns on the shipped `cspDirectives` default (base.yml, unchanged and still inherited from
  #    there -- not repeated here) for the whole suite, not just `tests/csp.spec.js`: the backend
  #    boots once for every spec file (see "Boots the real thing, not a dev proxy" in CLAUDE.md), CSP
  #    is read once at that boot (`index.ts`'s `Security` section) and there is no live-reload path
  #    for it (`models/security.ts`'s own doc comment: "takes effect on the next restart"), so there
  #    is no way to flip it on for one spec only without a second backend process against the same
  #    database -- which risks two `initDbValues()` racing an empty `settings` table on first boot,
  #    a hazard CLAUDE.md's e2e section already steers away from ("the seed IS the app's own
  #    first-run path"). Running the whole suite under the enforced policy is also the more honest
  #    check of the epic's own bar (OpenProject #2154): "do not flip enforceCsp's default without
  #    validating a full editor session... and every shipped block" -- if the shipped default broke
  #    `auth.spec.js` or `page-publish.spec.js`, that is exactly the kind of collateral damage this
  #    epic exists to catch before `enforceCsp: true` ever becomes the real default.
  #
  #    Reaches a fresh e2e database via `models/settings.ts#init()`, which seeds the `security`
  #    settings row from this merged `WIKI.config.security` rather than a hardcoded literal --
  #    see that file's own comment.
  enforceCsp: true
