# Backend config for the Playwright e2e suite (see CLAUDE.md's "Testing (e2e)" section).
#
# playwright.config.js points the backend at this file via CONFIG_FILE and starts it with
# DATABASE_URL set, which overrides every db.* connection field base.yml would otherwise supply --
# except db.schema, which still comes from base.yml's default ('wiki'). That is why there is no
# db: block here: one would either duplicate what DATABASE_URL already carries or, worse, drift
# from it silently.
port: 3000
dataPath: ./data/e2e-test
scheduler:
  # -> Lowered from base.yml's 300s so `scheduler.spec.js` (task 581) can observe a real
  #    `reapStaleJobs` sweep -- an `active` history row planted with an old `startedAt` -- without
  #    a multi-minute wait. `pollingCheck` (job claiming) is left at its 5s default; only the
  #    schedule-replan/reap interval is sped up.
  scheduledCheck: 5
  # -> Lowered from base.yml's 3600s to the same end: short enough that a deliberately-backdated
  #    `active` row reads as stale within the test's own polling window, long enough that no
  #    genuinely-running seeded task (checkVersion, purgeRateLimits, ...) is ever mistaken for one.
  staleJobTimeout: 20
security:
  # -> WP #2166 (part of #2154): `enforceCsp` is off by default in `base.yml` -- shipping it ON
  #    there would mean every real fresh install starts life with a policy nobody has confirmed
  #    works for THEIR site's blocks/theme/analytics. Here it is deliberately flipped on, so
  #    `e2e/tests/csp.spec.js` runs the editor, a block and a KaTeX expression against the exact
  #    default `cspDirectives` string this WP ships, catching a real violation instead of a
  #    disabled policy silently letting anything through. Reaches the seeded DB row via
  #    `models/settings.ts#securityCspSeed` (`WIKI.config.security`, which this file's merge into
  #    `base.yml`'s defaults produces) -- there is no live-reload of `enforceCsp` (`index.ts` reads
  #    it once, at server start, to register helmet's CSP plugin), so this has to be set before the
  #    very first boot, not toggled by a spec at runtime. `cspDirectives` itself is left unset here
  #    on purpose: `base.yml`'s own default is what `securityCspSeed` falls back to, so this spec
  #    is proving the SHIPPED string, not a copy of it duplicated into this file.
  enforceCsp: true
