name: Release

# The gated release channel: runs only when a maintainer pushes a `vX.Y.Z[-PRERELEASE]` tag. Every
# step through the Docker publish is a fail-closed gate — a job stops at its first failing step, so
# a red run neither pushes an image nor creates a GitHub Release.
#
# Deliberately not checked here:
#   - The backend/frontend/blocks/e2e suites are not re-run: `build.yml` already ran them for this
#     commit on `scarlett`. The first two steps enforce that instead — the tag is contained in
#     `scarlett`, and a successful `build.yml` run exists for the tagged commit. Neither re-reads
#     which steps passed within that run; docs/audits/release-checklist.md item 2 is where a human
#     confirms that.
#   - The migration tooling against a real 2.5.x dataset. No CI runner has one, and a fixture would
#     defeat the check, so it is NOT CI-enforceable here: it stays a manual sign-off by a named
#     human, recorded in the release PR (docs/audits/release-checklist.md item 5).
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours. 45 minutes matches build.yml's `build` job: the
    # heaviest leg here is the same QEMU-emulated multi-arch Docker build.
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      actions: read
      # Both for actions/attest-build-provenance only: it signs via GitHub's OIDC token and
      # publishes to the attestations API.
      attestations: write
      id-token: write

    # GITHUB_TOKEN's packages:write covers only this repo owner's packages, so the pushed tags must
    # live under this repo's own namespace, not a hard-coded one.
    env:
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the previous-release-tag lookup and git-cliff both need every
          # commit and every prior vX.Y.Z tag.
          fetch-depth: 0

      # RELEASING.md has the release manager tag directly off `scarlett`, so an ancestor check is
      # sufficient. `fetch-depth: 0` covers the tag ref only; the `scarlett` remote-tracking ref
      # needs its own fetch. First after checkout, so an off-branch tag fails before the API call
      # in the next step.
      - name: Verify tag is contained in scarlett
        run: |
          git fetch origin scarlett
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/scarlett; then
            echo "::error::Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not contained in scarlett — refusing to release a commit that hasn't gone through build.yml's quality gates and e2e suite on scarlett." >&2
            exit 1
          fi

      # Catches a scarlett commit whose push run was cancelled, skipped or red. Runs before every
      # gate below.
      - name: Verify build.yml succeeded for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_COUNT="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=build.yml \
            --commit="$GITHUB_SHA" --status=success --json databaseId --jq 'length')"
          if [ "$RUN_COUNT" -lt 1 ]; then
            echo "::error::No successful build.yml run found for commit $GITHUB_SHA (tag $GITHUB_REF_NAME). \
          This tag is not on a commit that has gone through the continuous alpha pipeline — it may be on a \
          release branch, or the scarlett push run for this commit was skipped, cancelled, or never ran. \
          Per docs/release-checklist.md item 2, do not release without a green build.yml run for this exact \
          commit. Push this commit to scarlett (or otherwise get a successful build.yml run recorded against \
          it) and retry."
            exit 1
          fi
          echo "Found $RUN_COUNT successful build.yml run(s) for commit $GITHUB_SHA."

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json

      # From here to Format Check: quality.yml's typecheck/lint/drift/format checks, repeated as
      # this workflow's own gate — calling quality.yml via `uses:` would re-run its test suites
      # too. All of it runs before the Docker login/build/push on purpose.
      # ONNXRUNTIME_NODE_INSTALL=skip: no CUDA download from nuget.org on a GPU-less runner (see
      # quality.yml; enforced by backend/test/workflowInstallEnv.test.ts).
      - name: Install Backend Dependencies
        working-directory: backend
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Lint
        working-directory: backend
        run: npx oxlint --deny-warnings

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Icons Check
        working-directory: frontend
        run: npm run icons:check

      - name: Frontend Emoji Check
        working-directory: frontend
        run: npm run emoji:check

      - name: Frontend Locales Check
        working-directory: frontend
        run: npm run locales:check

      - name: Frontend Lint
        working-directory: frontend
        run: npx oxlint --deny-warnings

      - name: Install Blocks Dependencies
        working-directory: blocks
        run: npm ci

      - name: Blocks Lint
        working-directory: blocks
        run: npx oxlint --deny-warnings

      # backend's installed, version-pinned oxfmt: a bare `npx oxfmt` would resolve whatever is
      # latest at run time.
      - name: Format Check
        run: npx --prefix backend oxfmt --check backend frontend blocks

      # Report-only on a release too: a quarantine lane that blocks releases is just a blocking
      # lane. It is the one gate step that does not stop the job, placed last so the exception
      # cannot be read as covering anything above it.
      # This job has no postgres service: a DB-backed test joining the lane would report red for a
      # missing DATABASE_URL. Add the service container when one does.
      - name: Quarantine Lane (report-only)
        continue-on-error: true
        run: ./scripts/ci-quarantine-lane.sh backend frontend blocks

      - name: Derive release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            STABLE=false
          else
            STABLE=true
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

          # A prerelease (-rc.N/-alpha.N/-beta.N) tag must never move :latest.
          {
            echo "tags<<TAGS_EOF"
            echo "$IMAGE_NAMESPACE:$VERSION"
            if [ "$STABLE" = "true" ]; then
              echo "$IMAGE_NAMESPACE:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set Version
        env:
          REL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      - name: Build Assets
        working-directory: frontend
        run: npm run build

      - name: Build Blocks
        working-directory: blocks
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registers binfmt_misc handlers so Buildx can cross-build the linux/arm64 layer through QEMU
      # on this amd64 runner. Must run before Buildx setup.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Consumed only for its labels/annotations outputs: the tags stay the shell-computed
      # steps.version.outputs.tags, not this action's own tag generation. Labels not overridden
      # here (source/revision/created/version/licenses) come from the action's GitHub context.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          labels: |
            org.opencontainers.image.title=Cardinal.js
            org.opencontainers.image.description=Next-generation open source wiki
            org.opencontainers.image.vendor=Cardinal.js
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}

      - name: Build and push Docker images
        id: docker_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Max-mode SLSA provenance (build definition + materials, not BuildKit's minimal default)
          # and an SPDX SBOM, attached to the image manifest. The signed attestation is the next
          # step.
          provenance: mode=max
          sbom: true

      # Keyless Sigstore attestation over the pushed digest. Keyed on repo name + digest rather than
      # a tag: every tag from this build resolves to the same digest, so one attestation covers all.
      # Verify with: gh attestation verify oci://$IMAGE_NAMESPACE:<version> --owner ${{ github.repository_owner }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_NAMESPACE }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true

      # Mirrors build.yml's "Prepare build archive" step — keep in sync — so a tagged release also
      # gets an offline-installable archive.
      - name: Prepare release archive
        run: |
          mkdir -p _dist/blocks
          cp -R assets _dist/assets
          cp -R blocks/compiled _dist/blocks/compiled
          cp -R backend _dist/backend
          cp LICENSE _dist/LICENSE
          cp config.sample.yml _dist/config.sample.yml
          cd _dist/backend
          npm ci --omit=dev
          cd -
          find ./_dist/ -printf "%P\n" | tar -czf wiki-js.tar.gz --no-recursion -C ./_dist/ -T -

      - name: Checksum release archive
        run: sha256sum wiki-js.tar.gz > wiki-js.tar.gz.sha256

      - name: Determine previous release tag
        id: prev_tag
        run: |
          # With no previous tag (the first release) `spec` stays empty, and git-cliff walks the
          # whole history up to this tag.
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -v -x "$GITHUB_REF_NAME" | head -n1)"
          if [ -n "$PREV_TAG" ]; then
            echo "spec=${PREV_TAG}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: ${{ steps.prev_tag.outputs.spec }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ steps.version.outputs.stable != 'true' }}
          files: |
            wiki-js.tar.gz
            wiki-js.tar.gz.sha256
