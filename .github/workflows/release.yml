name: Release

# The gated release channel — see docs/versioning.md, "Channel 2: real releases". Triggered ONLY by
# a maintainer pushing a `vX.Y.Z[-PRERELEASE]` git tag, never by a push to `scarlett`, a merge, or a
# green CI run on the continuous alpha channel (`build.yml`, left completely untouched by this
# file). Every step below through the Docker publish is a hard, fail-closed gate: a GitHub Actions
# job stops at the first failing step, so nothing after a failure runs, and in particular neither
# the Docker push nor the GitHub Release creation happen on a red run.
#
# What this workflow deliberately does NOT check, and why that's not an oversight:
#   - The backend/frontend/blocks/e2e test suites are not re-run here. `build.yml`'s `quality` job
#     (`quality.yml`) runs the backend/frontend/blocks suites and its own `build` job runs the
#     Playwright suite, both on every push to `scarlett` — re-running the full Postgres + Playwright
#     suite a second time here would just be an expensive echo of a check that already happened, not
#     an independent gate. What this workflow DOES check, as its very first step (before any other
#     gate below), is that such a run actually exists and was green for the exact commit the tag
#     points at: "Verify build.yml succeeded for this commit" runs
#     `gh run list --workflow=build.yml --commit=$GITHUB_SHA --status=success` and fails the job
#     closed if nothing comes back. That closes the gap `docs/versioning.md` itself calls out — a
#     tag pushed against a release branch, or against a `scarlett` commit whose push run was
#     cancelled or skipped, used to publish a Docker image and GitHub Release having only run this
#     file's own typecheck/lint/format checks below, with nothing to verify the tagged commit was
#     ever built and tested at all. The chosen fix is this existence-and-success check rather than
#     re-invoking `quality.yml` via `uses:` here: it preserves the "don't run the same suite twice
#     per commit" reasoning while turning the assumption into an enforced, fail-closed gate. This
#     guard proves a green `build.yml` run exists for this SHA; it does not itself re-read which
#     named steps passed within that run — docs/release-checklist.md item 2 is still the place a
#     human confirms that level of detail.
#   - Epic 13's migration tooling exercised against a real 2.5.x dataset. No CI runner has access to
#     a real department's 2.5.x data, and faking it with a fixture would defeat the point of the
#     check (docs/release-checklist.md, item 5, spells this out in full).
# The migration sign-off above remains a manual sign-off step, performed by a named human and
# recorded in the release PR description (docs/release-checklist.md, item 5) — it is NOT CI-enforceable
# here and this workflow makes no attempt to assert it. A release manager who tags without having
# actually done that manual step has skipped the checklist, not tripped a gate that would have
# caught it; that remains a process/checklist enforcement problem for that one item, not something
# this YAML file can fix.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read

    # docker/login-action authenticates as github.repository_owner using the run's GITHUB_TOKEN,
    # whose packages:write scope only covers that owner's packages -- so the pushed tags must live
    # under this repo's own namespace, not a hard-coded one that may belong to someone else.
    env:
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags: both the "previous release tag" lookup below and git-cliff's own
          # changelog generation need to see every commit and every prior vX.Y.Z tag, not just the
          # tag that was pushed.
          fetch-depth: 0

      # --- Fail-closed guard: a build.yml run must exist for this exact commit ---------------
      # See the header comment above for the full reasoning. This intentionally runs before
      # anything else in the job, `actions/checkout` aside, so a tag pushed against a commit that
      # never went through the continuous-alpha pipeline (a release branch, or a scarlett commit
      # whose push run was cancelled/skipped) never reaches the quality gates, the Docker publish,
      # or the GitHub Release below.
      - name: Verify build.yml succeeded for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_COUNT="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=build.yml \
            --commit="$GITHUB_SHA" --status=success --json databaseId --jq 'length')"
          if [ "$RUN_COUNT" -lt 1 ]; then
            echo "::error::No successful build.yml run found for commit $GITHUB_SHA (tag $GITHUB_REF_NAME). \
          This tag is not on a commit that has gone through the continuous alpha pipeline — it may be on a \
          release branch, or the scarlett push run for this commit was skipped, cancelled, or never ran. \
          Per docs/release-checklist.md item 2, do not release without a green build.yml run for this exact \
          commit. Push this commit to scarlett (or otherwise get a successful build.yml run recorded against \
          it) and retry."
            exit 1
          fi
          echo "Found $RUN_COUNT successful build.yml run(s) for commit $GITHUB_SHA."

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json

      # --- Hard-required quality gates ------------------------------------------------------
      # The same typecheck/lint/format/icon-drift checks task #423 wires into build.yml's
      # push-to-scarlett job, duplicated here as this workflow's own independent gate rather than
      # shared via `uses:`/`needs:` (which only works between jobs in the same workflow run): a
      # release tag must never publish on a failure here even if the scarlett-push run for this
      # exact commit is stale, was skipped, or #423 hasn't landed in build.yml at all yet. Every
      # step in this section runs before the Docker login/build/push below on purpose — a failure
      # anywhere in this section stops the job and nothing below it ever runs.
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Lint
        working-directory: backend
        run: npx oxlint --deny-warnings

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # See quality gate rationale in build.yml (task #423): both check scripts diff the committed
      # generated bundle against what source + already-`npm ci`-installed data packages produce
      # right now — a build-time literal-reference scan, no network call, safe on a cold runner.
      - name: Frontend Icons Check
        working-directory: frontend
        run: npm run icons:check

      - name: Frontend Emoji Check
        working-directory: frontend
        run: npm run emoji:check

      - name: Frontend Locales Check
        working-directory: frontend
        run: npm run locales:check

      - name: Frontend Lint
        working-directory: frontend
        run: npx oxlint --deny-warnings

      - name: Install Blocks Dependencies
        working-directory: blocks
        run: npm ci

      - name: Blocks Lint
        working-directory: blocks
        run: npx oxlint --deny-warnings

      # Run from backend's own already-installed, version-pinned oxfmt rather than a bare
      # `npx oxfmt`, which would resolve whatever `latest` happens to be at run time — see
      # quality.yml's (task #423) own comment for the full reasoning. The root .oxfmtrc.json is
      # picked up automatically since oxfmt searches upward from each target path.
      - name: Format Check
        run: npx --prefix backend oxfmt --check backend frontend blocks

      # --- Version derivation, per docs/versioning.md "Docker tags on a release" -------------
      - name: Derive release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            STABLE=false
          else
            STABLE=true
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

          # $IMAGE_NAMESPACE:<version> always; $IMAGE_NAMESPACE:latest only rewritten on a stable
          # (non-prerelease) tag — an -rc.N/-alpha.N/-beta.N tag must never move :latest.
          {
            echo "tags<<TAGS_EOF"
            echo "$IMAGE_NAMESPACE:$VERSION"
            if [ "$STABLE" = "true" ]; then
              echo "$IMAGE_NAMESPACE:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set Version
        env:
          REL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      - name: Build Assets
        working-directory: frontend
        run: npm run build

      - name: Build Blocks
        working-directory: blocks
        run: npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.version.outputs.tags }}

      # --- Changelog + GitHub Release ---------------------------------------------------------
      - name: Determine previous release tag
        id: prev_tag
        run: |
          # Newest vX.Y.Z(-prerelease) tag other than the one just pushed, so the changelog covers
          # exactly the range since the last release — matches docs/versioning.md's "Generating a
          # changelog" section. When there is no previous tag (this is the first release), leave
          # `spec` empty: git-cliff then walks the whole history up to this tag, the same "no last
          # release" behavior that document describes for `--unreleased` today.
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -v -x "$GITHUB_REF_NAME" | head -n1)"
          if [ -n "$PREV_TAG" ]; then
            echo "spec=${PREV_TAG}..${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "spec=" >> "$GITHUB_OUTPUT"
          fi

      # cliff.toml (task #774) groups commits into Features/Bug Fixes/Refactors/Chores. Runs
      # against exactly the commit range determined above via the repo-root config, matching
      # `git-cliff --config cliff.toml <range>` from docs/versioning.md.
      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.prev_tag.outputs.spec }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ steps.version.outputs.stable != 'true' }}
