name: E2E Smoke Suite

# No `push:` trigger: build.yml runs this same suite inside its own `build` job on every push to
# `scarlett`, because only a job in the same workflow run can gate the Docker push.
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours. 30 minutes is headroom over the builds, the installs
    # and the e2e suite.
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      # A fresh container per run: the backend's first-run path (core/config.ts's `initDbValues()`)
      # seeds the database when it finds no settings row, so nothing here pre-loads data.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      # This job runs PR-controlled code and never pushes, so the checkout leaves no credentialed
      # .git/config on the runner for that code to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json
            e2e/package-lock.json

      # -> The e2e suite boots the built, production-shaped stack -- backend on :3000 serving
      #    frontend/'s `vite build` output from `assets/` -- not the dev-mode Vite proxy.
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # -> Without `blocks/compiled/` every /_blocks/*.js request is a 404, and csp.spec.js's block
      #    coverage never exercises CSP against a real block render.
      - name: Build blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      # ONNXRUNTIME_NODE_INSTALL=skip: no CUDA download from nuget.org on a GPU-less runner.
      - name: Install backend dependencies
        working-directory: backend
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
