name: E2E Smoke Suite

# `build.yml` now runs this same suite as part of its own `build` job on every push to `scarlett`
# (task 762: it has to gate the Docker push on it, which a separate workflow can't do — it runs in
# parallel with no way to block a job in a different workflow run). Triggering here too on that same
# push would mean installing Playwright's browsers and running the whole suite twice per push for no
# gain. Left for pull_request/workflow_dispatch, which build.yml's push-only trigger doesn't cover.
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      # A fresh service container per run is what makes "seeded test database" true every time --
      # the backend's own first-run path (core/config.ts's initDbValues()) does the actual seeding
      # the moment it finds no settings row, so nothing here pre-loads data of its own.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      # This job only reads the repo and runs PR-controlled code (npm ci against the PR's
      # lockfiles, then its own webServer.command) -- it never pushes, so there's no reason for
      # the checkout to leave a credentialed .git/config on the runner for that code to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json
            e2e/package-lock.json

      # -> The e2e suite boots the built, production-shaped stack -- backend on :3000 serving
      #    frontend/'s `vite build` output from `assets/` -- not the dev-mode Vite proxy.
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # -> Missing here (unlike build.yml's own e2e leg, which this workflow's own header comment
      #    says duplicates that one to avoid a second full run per push) left `blocks/compiled/`
      #    absent, which `index.ts` warns about at boot ("root" path ".../blocks/compiled" must
      #    exist) and serves as a 404 for every /_blocks/*.js request. csp.spec.js's own
      #    self-contained-block coverage (block-checklist, block-tabs, block-infobox, ...) never
      #    got past that 404 to actually exercise CSP against a real block render.
      - name: Build blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
