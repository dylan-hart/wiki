name: Quality Gates

# Runs on every pull request, and is called by build.yml's `quality` job on every push to
# `scarlett`. A `needs:` dependency only works on a job in the same workflow run, so
# `workflow_call:` is what lets the Docker publish gate on this one shared definition instead of a
# second copy of the same steps.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  production-boot-smoke-test:
    name: Production Install Smoke Boot
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours; this job normally finishes in under a minute.
    timeout-minutes: 10
    permissions:
      contents: read

    # No postgres service, deliberately: the boot only has to reach core/db.ts's `connect()` retry
    # loop. backend/ is installed with `npm ci --omit=dev` and nothing else -- the tree
    # dev/build/Dockerfile and build.yml's "Prepare build archive" ship -- so a devDependency-only
    # import on the boot path fails here rather than in the published artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ONNXRUNTIME_NODE_INSTALL=skip (here and on every other backend install step): onnxruntime-node's
      # postinstall would otherwise fetch a CUDA package from nuget.org that CI has no GPU to use, and a
      # nuget outage would fail the job. Enforced by backend/test/workflowInstallEnv.test.ts.
      - name: Install Backend Dependencies (production shape)
        working-directory: backend
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --omit=dev

      - name: Use sample config
        run: cp config.sample.yml config.yml

      # `node backend` must run from the repo root -- index.ts refuses otherwise.
      # Bounded with `timeout` rather than left to core/db.ts's retry loop running to completion:
      # the first attempt against an unreachable database fails immediately, so a few seconds is
      # enough to see either a module-resolution crash or `connect()`'s per-attempt
      # "connection failed, retrying" warning. Grep for that line, not the exhausted-retries error,
      # which this bounded window never reaches.
      - name: Boot smoke test (production install, unreachable database)
        run: |
          set +e
          timeout 20s node backend > boot.log 2>&1
          echo "--- boot output ---"
          cat boot.log
          echo "--------------------"

          if grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (package|module)' boot.log; then
            echo "::error::Production install (npm ci --omit=dev) cannot resolve a module the boot path imports -- a devDependency has leaked onto the real boot path (the shape of defect this job exists to catch, as @js-temporal/polyfill once did)."
            exit 1
          fi

          if ! grep -q 'connection failed, retrying' boot.log; then
            echo "::error::Boot did not reach the database-connect stage at all, so this step asserted nothing useful -- investigate the boot log above."
            exit 1
          fi

          echo "OK: production install resolved every module the boot path imports, and boot reached the (expectedly unreachable) database-connect stage."

  quality:
    name: Typecheck, Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours; 30 minutes is headroom over this job's real
    # wall-clock time.
    timeout-minutes: 30
    permissions:
      contents: read

    # For the backend's DB-backed suites, which backend/test/db.ts switches on whenever DATABASE_URL
    # is set. The frontend and blocks suites never touch it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # For backend/modules/storage/s3/storage.emulated.test.ts. MinIO is started by the "Start
      # MinIO" step below rather than as a `services:` entry: the services block has no `command:`
      # field, and MinIO's image ships no default CMD (without `server /data` it prints help and
      # exits).
      S3_TEST_ENDPOINT: http://minioadmin:minioadmin@localhost:9000

    steps:
      # Full history: backend/test/changelog.test.ts runs `git-cliff --unreleased` against this
      # checkout, and the default depth-1 clone leaves it a changelog with zero sections.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      # git-cliff is a standalone binary, not an npm dependency of any workspace, pinned to a
      # concrete release. .devcontainer/Dockerfile's GIT_CLIFF_VERSION must match it.
      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin git-cliff-2.13.1/git-cliff
          git-cliff --version

      # backend/models/import.test.ts's real-pandoc test (gated on `pandocAvailable`) is the only
      # thing in the unit suites that needs the actual binary -- everything else mocks `runPandoc`.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Lint
        working-directory: backend
        run: npx oxlint --deny-warnings

      # FIXME: this step and the "Install pandoc" step after it repeat the two steps before "Backend
      # Typecheck"; delete this pair.
      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin git-cliff-2.13.1/git-cliff
          git-cliff --version

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      # MinIO's image lives at quay.io only and has no floating LTS-major tag, so this pins a
      # concrete RELEASE tag. .devcontainer/docker-compose.yml's `minio` service must match it.
      - name: Start MinIO (S3 emulation for backend/modules/storage/s3)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO
        run: timeout 30s bash -c 'until curl -sf http://localhost:9000/minio/health/ready > /dev/null; do sleep 1; done'

      - name: Backend Tests
        working-directory: backend
        run: npm run test

      # Fails when a block's `label`/`hint`/`description` strings in blocks/block-*/component.js and
      # the blocks.<tag>.* keys in locales/en.json have drifted apart.
      - name: Backend Block Locale Keys Check
        working-directory: backend
        run: npm run block-locale-keys:check

      # Fails when the committed assets/icon-sets/tabler.json has drifted from the pinned
      # @iconify-json/tabler devDependency -- a hand-edit, or a bump with no re-vendor. No network.
      - name: Backend Vendor Icons Check
        working-directory: backend
        run: npm run vendor-icons:check

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # The icons and emoji checks each diff a committed generated bundle
      # (src/assets/*.generated.js) against what the source and the installed data packages produce.
      # They read node_modules only: no network call, nothing to be flaky on a cold runner.
      - name: Frontend Icons Check
        working-directory: frontend
        run: npm run icons:check

      - name: Frontend Emoji Check
        working-directory: frontend
        run: npm run emoji:check

      # oxlint has no i18n rule, so `src/i18nSourceGate.test.js` is the guard against an
      # untranslated English literal. It also runs inside `npm run test` below; its own step makes a
      # failure read as that rather than being lost in the frontend suite's output.
      - name: Frontend i18n Source Check
        working-directory: frontend
        run: npm run i18n:check

      # Fails when a key in backend/locales/en.json has no reader in frontend/src.
      - name: Frontend Locales Check
        working-directory: frontend
        run: npm run locales:check

      # Fails when a bare `err.message` reaches a `notify()` call in a `.vue` file: it carries only
      # ky's generic "Request failed with status code N", where `helpers/apiError.js`'s
      # `apiErrorMessage(err, fallback)` reads the server's own message.
      - name: Frontend Notify err.message Check
        working-directory: frontend
        run: npm run notify-check

      - name: Frontend Lint
        working-directory: frontend
        run: npx oxlint --deny-warnings

      # `test/realGridLayout.js` measures real CSS Grid layout in headless Chromium: neither jsdom
      # nor happy-dom runs a layout engine.
      - name: Install Playwright Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend Tests
        working-directory: frontend
        run: npm run test

      - name: Install Blocks Dependencies
        working-directory: blocks
        run: npm ci

      # The same cross-check as "Backend Block Locale Keys Check" above, from the blocks side
      # (blocks/scripts/check-locale-keys.mjs).
      - name: Blocks Locale Keys Check
        working-directory: blocks
        run: npm run locale-keys:check

      - name: Blocks Lint
        working-directory: blocks
        run: npx oxlint --deny-warnings

      - name: Blocks Tests
        working-directory: blocks
        run: npm run test

      # The `*.flaky.*` lane: tests that depend on real external state no care inside the test makes
      # deterministic. `continue-on-error: true` makes it report-only, deliberately -- but the
      # script still exits non-zero on a red lane, so the step shows as failed-but-continued rather
      # than a green tick nobody reads.
      #
      # Covers the workspaces whose dependencies this job installs; the `e2e/` lane runs in
      # build.yml's `build` job, where e2e's dependencies, browsers and `assets/` build exist.
      - name: Quarantine Lane (report-only)
        continue-on-error: true
        run: ./scripts/ci-quarantine-lane.sh backend frontend blocks

      # Backend's installed, version-pinned oxfmt rather than a bare `npx oxfmt`, which would
      # resolve whatever `latest` is at run time: backend's install is the canonical one for
      # repo-root checks. The root .oxfmtrc.json is found by oxfmt's upward search from each target.
      - name: Format Check
        run: npx --prefix backend oxfmt --check backend frontend blocks
