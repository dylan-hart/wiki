name: Quality Gates

# Runs on every pull request (fast feedback before code lands) and is also called by build.yml's
# own `quality` job via `uses:` on every push to `scarlett`, so the Docker publish job can gate on
# it with `needs:` -- exactly the reason e2e.yml gives for staying a separate workflow instead of a
# few more steps bolted onto build.yml: a `needs:` dependency only works on a job in the *same*
# workflow run, and a plain `pull_request:` trigger added directly to build.yml would have no way to
# stop the expensive Docker build/push job from also queuing up on every PR. `workflow_call:` lets
# this file be that one shared definition instead of a second copy of the same steps.
#
# Also runs the backend/frontend/blocks unit suites (`npm run test`), not only typecheck/lint/format
# -- previously these ran nowhere on `pull_request`, only in build.yml's push-to-scarlett `build` job,
# so a broken unit test landed via a green PR and first failed after merge. build.yml's own `build`
# job no longer repeats them: it already `needs: quality`, so re-running the same three suites there
# on every push would just be paying for them twice for no new coverage -- the same "don't run the
# same suite twice per commit" reasoning e2e.yml's own header comment gives for its removed push
# trigger. build.yml's postgres service and DATABASE_URL stay, since its Playwright leg still needs
# both for its own first-run seeding.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Backing store for the backend's DB-backed model tests (test/db.ts's fixtures switch themselves
    # on whenever DATABASE_URL is set) -- the frontend and blocks suites are pure-unit and never
    # touch it. Same one-service-container-per-run shape as build.yml's own postgres service.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Lint
        working-directory: backend
        run: npx oxlint --deny-warnings

      - name: Backend Tests
        working-directory: backend
        run: npm run test

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Both check scripts diff the committed generated bundle (src/assets/icons.generated.js,
      # src/assets/emoji.generated.js) against what the source + already-`npm ci`-installed data
      # packages (@iconify-json/mdi, @iconify-json/la, unicode-emoji-json, markdown-it-emoji) produce
      # right now -- read fs.readFileSync(node_modules/...) only, no fetch/http anywhere in either
      # script. That's a build-time literal-reference scan, not the runtime `models/icons.ts`
      # resolution chain CLAUDE.md's Icons section describes (memory -> disk cache -> db -> live
      # Iconify API) for icons a *user* picks on a page -- this repo's own chrome icons are inlined at
      # build time specifically so nothing here ever depends on that service. So both steps are safe
      # to run on a cold CI runner with no prior icon cache: no network call, nothing to be flaky.
      - name: Frontend Icons Check
        working-directory: frontend
        run: npm run icons:check

      - name: Frontend Emoji Check
        working-directory: frontend
        run: npm run emoji:check

      # Fails when a bare `err.message` reaches a `notify()` call in `frontend/src/**/*.vue` --
      # `helpers/apiError.js`'s `apiErrorMessage(err, fallback)` exists specifically to read the
      # server's `{ ok, error, statusCode, message }` body off `err.data` instead, since a bare
      # `err.message` yields only ky's generic "Request failed with status code N". A repo grep, not
      # a runtime check: reads the `.vue` sources directly, same "no network, safe on a cold runner"
      # shape as the icon/emoji checks above. See `frontend/scripts/check-notify-err-message.mjs` for
      # the two allowlisted non-HTTP shapes (clipboard failures, `console.warn` template strings).
      - name: Frontend Notify err.message Check
        working-directory: frontend
        run: npm run notify-check

      - name: Frontend Lint
        working-directory: frontend
        run: npx oxlint --deny-warnings

      # `test/realGridLayout.js` (OpenProject #1261) drives a real headless Chromium page to measure
      # actual CSS Grid column layout -- neither jsdom nor happy-dom runs a layout engine, so this is
      # the only way a test can tell a fixed defect from a re-broken one. Only chromium is needed,
      # matching e2e/'s own `install-browsers` script.
      - name: Install Playwright Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend Tests
        working-directory: frontend
        run: npm run test

      - name: Install Blocks Dependencies
        working-directory: blocks
        run: npm ci

      - name: Blocks Lint
        working-directory: blocks
        run: npx oxlint --deny-warnings

      - name: Blocks Tests
        working-directory: blocks
        run: npm run test

      # Run from backend's own already-installed, version-pinned oxfmt (see backend/package.json)
      # rather than a bare `npx oxfmt`, which would silently resolve whatever `latest` happens to be
      # at run time -- exactly the floating-tag drift CLAUDE.md's Currency section rules out. The
      # root .oxfmtrc.json is picked up automatically since oxfmt searches upward from each target
      # path; its own `$schema` already points at backend/node_modules/oxfmt, confirming backend's
      # install is the one meant to be canonical for repo-root checks.
      - name: Format Check
        run: npx --prefix backend oxfmt --check backend frontend blocks
