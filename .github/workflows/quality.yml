name: Quality Gates

# Runs on every pull request (fast feedback before code lands) and is also called by build.yml's
# own `quality` job via `uses:` on every push to `scarlett`, so the Docker publish job can gate on
# it with `needs:` -- exactly the reason e2e.yml gives for staying a separate workflow instead of a
# few more steps bolted onto build.yml: a `needs:` dependency only works on a job in the *same*
# workflow run, and a plain `pull_request:` trigger added directly to build.yml would have no way to
# stop the expensive Docker build/push job from also queuing up on every PR. `workflow_call:` lets
# this file be that one shared definition instead of a second copy of the same steps.
#
# Also runs the backend/frontend/blocks unit suites (`npm run test`), not only typecheck/lint/format
# -- previously these ran nowhere on `pull_request`, only in build.yml's push-to-scarlett `build` job,
# so a broken unit test landed via a green PR and first failed after merge. build.yml's own `build`
# job no longer repeats them: it already `needs: quality`, so re-running the same three suites there
# on every push would just be paying for them twice for no new coverage -- the same "don't run the
# same suite twice per commit" reasoning e2e.yml's own header comment gives for its removed push
# trigger. build.yml's postgres service and DATABASE_URL stay, since its Playwright leg still needs
# both for its own first-run seeding.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  production-boot-smoke-test:
    name: Production Install Smoke Boot
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # No postgres service here, deliberately: the whole point of this job is that the database is
    # unreachable, so the boot path's own retry-then-fail behavior (core/db.ts's `connect()`) is what
    # gets asserted on, not a real connection succeeding. `npm ci` (full, with devDependencies) is
    # never run in backend/ in this job -- only `npm ci --omit=dev`, the exact tree
    # dev/build/Dockerfile and the release tarball step in build.yml's `Prepare build archive` both
    # actually ship. Task 1994/1999/2007: nothing before this job ever exercised that install shape,
    # which is how a devDependency-only import on the real boot path (`@js-temporal/polyfill`, until
    # #1999) went unnoticed by CI entirely -- see docs/variances.md's `@js-temporal/polyfill` entry
    # for the concrete case that prompted this job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (production shape)
        working-directory: backend
        run: npm ci --omit=dev

      - name: Use sample config
        run: cp config.sample.yml config.yml

      # `node backend` must run from the repo root (index.ts refuses otherwise) -- see CLAUDE.md.
      # Bounded with `timeout` rather than left to core/db.ts's own 10-attempt/3s retry loop running
      # to completion (~30s+): the very first connection attempt against an unreachable database
      # fails immediately, so a couple of seconds is enough to see either the module-resolution
      # crash we're guarding against or the first "Database connection error" log line -- whichever
      # comes first tells us everything this step needs to know.
      - name: Boot smoke test (production install, unreachable database)
        run: |
          set +e
          timeout 20s node backend > boot.log 2>&1
          echo "--- boot output ---"
          cat boot.log
          echo "--------------------"

          if grep -qE 'ERR_MODULE_NOT_FOUND|Cannot find (package|module)' boot.log; then
            echo "::error::Production install (npm ci --omit=dev) cannot resolve a module the boot path imports -- a devDependency has leaked onto the real boot path. See docs/variances.md's @js-temporal/polyfill entry for the shape of defect this catches."
            exit 1
          fi

          if ! grep -q 'Database connection error' boot.log; then
            echo "::error::Boot did not reach the database-connect stage at all, so this step asserted nothing useful -- investigate the boot log above."
            exit 1
          fi

          echo "OK: production install resolved every module the boot path imports, and boot reached the (expectedly unreachable) database-connect stage."

  quality:
    name: Typecheck, Lint, Format & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Backing store for the backend's DB-backed model tests (test/db.ts's fixtures switch themselves
    # on whenever DATABASE_URL is set) -- the frontend and blocks suites are pure-unit and never
    # touch it. Same one-service-container-per-run shape as build.yml's own postgres service.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      # fetch-depth: 0 (full history) -- backend/test/changelog.test.ts runs `git-cliff --unreleased`
      # against this checkout's own history; the default shallow (depth-1) clone leaves only the tip
      # commit, which git-cliff's commit_parsers then drops entirely (a squash-merge "Cycle: ..."
      # subject matches none of them), producing a changelog with zero sections and failing every
      # assertion in that suite.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      # git-cliff is a standalone binary, not an npm dependency of any workspace (see
      # backend/test/changelog.test.ts's header comment and docs/versioning.md) -- pinned to a
      # concrete release rather than a floating tag, per this project's Currency standard.
      # release.yml's own generation step uses orhun/git-cliff-action@v4 instead, which runs in
      # that action's own container and never executes this unit suite.
      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin git-cliff-2.13.1/git-cliff
          git-cliff --version

      # backend/models/import.test.ts's real-pandoc test (gated on `pandocAvailable`) is the only
      # thing in the unit suites that needs the actual binary -- everything else mocks `runPandoc`.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Backend Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend Lint
        working-directory: backend
        run: npx oxlint --deny-warnings

      # git-cliff is a standalone binary, not an npm dependency of any workspace (see
      # backend/test/changelog.test.ts's header comment and docs/versioning.md) -- pinned to a
      # concrete release rather than a floating tag, per this project's Currency standard.
      # release.yml's own generation step uses orhun/git-cliff-action@v4 instead, which runs in
      # that action's own container and never executes this unit suite.
      - name: Install git-cliff
        run: |
          curl -sL https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin git-cliff-2.13.1/git-cliff
          git-cliff --version

      # backend/models/import.test.ts's real-pandoc test (gated on `pandocAvailable`) is the only
      # thing in the unit suites that needs the actual binary -- everything else mocks `runPandoc`.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Backend Tests
        working-directory: backend
        run: npm run test

      # Same shape as the Frontend Icons/Emoji Check steps below: a block's `label`/`hint`/
      # `description` strings are read straight off blocks/block-*/component.js (no fetch/network),
      # and diffed against the blocks.<tag>.* keys committed in locales/en.json -- a new string with
      # no key, a changed string with a stale key, or an orphaned key from a removed block/prop all
      # fail this step. See backend/scripts/blockLocaleKeys.ts.
      - name: Backend Block Locale Keys Check
        working-directory: backend
        run: npm run block-locale-keys:check

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Both check scripts diff the committed generated bundle (src/assets/icons.generated.js,
      # src/assets/emoji.generated.js) against what the source + already-`npm ci`-installed data
      # packages (@iconify-json/mdi, @iconify-json/la, unicode-emoji-json, markdown-it-emoji) produce
      # right now -- read fs.readFileSync(node_modules/...) only, no fetch/http anywhere in either
      # script. That's a build-time literal-reference scan, not the runtime `models/icons.ts`
      # resolution chain CLAUDE.md's Icons section describes (memory -> disk cache -> db -> live
      # Iconify API) for icons a *user* picks on a page -- this repo's own chrome icons are inlined at
      # build time specifically so nothing here ever depends on that service. So both steps are safe
      # to run on a cold CI runner with no prior icon cache: no network call, nothing to be flaky.
      - name: Frontend Icons Check
        working-directory: frontend
        run: npm run icons:check

      - name: Frontend Emoji Check
        working-directory: frontend
        run: npm run emoji:check

      # OpenProject #1615, the last child of #1586 ("Localize the shared library's 14 English
      # strings, the 41 hardcoded notify messages and the group permission catalog"): oxlint has no
      # i18n rule, so this Vitest source-scan (`src/i18nSourceGate.test.js`) is the regression guard
      # against a newly reintroduced untranslated English literal -- a capitalised sentence passed as
      # `message:` to `notify()`, the same thrown from `new Error()`, a static `aria-label="…"` /
      # `label="…"` literal under `src/components` or `src/pages`, or the misspelled
      # `'An unexpected error occured.'`. It also runs as part of `npm run test` below (it is a
      # `*.test.js` file under `src`), but gets its own step here -- the same way `icons:check` and
      # `emoji:check` do above -- so a failure here reads as "untranslated literal reintroduced"
      # rather than being lost in the much larger frontend suite's output.
      - name: Frontend i18n Source Check
        working-directory: frontend
        run: npm run i18n:check

      # Same "source scan must stay in step with a side file" shape as the checks above, but for
      # backend/locales/en.json: fails if any key has no reader in frontend/src (crediting a dynamic
      # `t(...)` call's template-literal/concatenation prefix, lookup-table indirection, or
      # `<i18n-t keypath>` usage -- see check-locales.mjs's own header comment). Pure source-text
      # scanning, same as the icons/emoji checks -- no network, safe on a cold runner.
      - name: Frontend Locales Check
        working-directory: frontend
        run: npm run locales:check

      # Fails when a bare `err.message` reaches a `notify()` call in `frontend/src/**/*.vue` --
      # `helpers/apiError.js`'s `apiErrorMessage(err, fallback)` exists specifically to read the
      # server's `{ ok, error, statusCode, message }` body off `err.data` instead, since a bare
      # `err.message` yields only ky's generic "Request failed with status code N". A repo grep, not
      # a runtime check: reads the `.vue` sources directly, same "no network, safe on a cold runner"
      # shape as the icon/emoji checks above. See `frontend/scripts/check-notify-err-message.mjs` for
      # the two allowlisted non-HTTP shapes (clipboard failures, `console.warn` template strings).
      - name: Frontend Notify err.message Check
        working-directory: frontend
        run: npm run notify-check

      - name: Frontend Lint
        working-directory: frontend
        run: npx oxlint --deny-warnings

      # `test/realGridLayout.js` (OpenProject #1261) drives a real headless Chromium page to measure
      # actual CSS Grid column layout -- neither jsdom nor happy-dom runs a layout engine, so this is
      # the only way a test can tell a fixed defect from a re-broken one. Only chromium is needed,
      # matching e2e/'s own `install-browsers` script.
      - name: Install Playwright Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Frontend Tests
        working-directory: frontend
        run: npm run test

      - name: Install Blocks Dependencies
        working-directory: blocks
        run: npm ci

      # AST-parses every block-*/component.js's "static definition" (via rollup/parseAst, the same
      # parser rollup.config.mjs's own blocksManifest() plugin uses) and cross-checks its
      # description:/label:/hint: strings 1:1 against the blocks.<tag>.* keys in
      # backend/locales/en.json -- no orphan key left behind, no string minted without one. See
      # blocks/scripts/check-locale-keys.mjs's header comment for the key convention (OpenProject
      # #1628). Reads only files already on disk from checkout, no network, so it's as safe on a cold
      # CI runner as the Icons/Emoji Check steps above.
      - name: Blocks Locale Keys Check
        working-directory: blocks
        run: npm run locale-keys:check

      - name: Blocks Lint
        working-directory: blocks
        run: npx oxlint --deny-warnings

      - name: Blocks Tests
        working-directory: blocks
        run: npm run test

      # --- Quarantine lane (report-only) ------------------------------------------------------
      # OpenProject #2692 (Feature #2603, Epic #2600). The `*.flaky.*` lane is every test that
      # depends on real external state no care inside the test makes deterministic -- see
      # docs/decisions/flaky-test-quarantine.md, which is the authority on what belongs in it. It
      # runs here as its own step so a fragile test is visible without being a trunk-red generator.
      #
      # `continue-on-error: true` is what makes it report-only, and it is deliberate rather than
      # incidental: every other step in this workflow relies on GitHub Actions' `false` default, so
      # this is the one place the exception is stated. The script itself still exits non-zero on a
      # red lane, which renders the step with the failed-but-continued marker rather than a plain
      # green tick -- a step that cannot fail is a step nobody reads, which is exactly how a lane
      # rots. It also writes a job summary table and one `::error::` annotation per failed lane, so
      # a red lane is legible on the run page without opening a log.
      #
      # Covers backend/frontend/blocks -- the three workspaces whose dependencies this job installs.
      # The `e2e/` lane runs in build.yml's `build` job instead, where e2e's own dependencies,
      # browsers, postgres service and a real `assets/` build already exist; see the step there.
      #
      # Note this workflow is a `workflow_call:` target invoked by build.yml, so this step runs on
      # every pull request AND every push to scarlett. Intended.
      - name: Quarantine Lane (report-only)
        continue-on-error: true
        run: ./scripts/ci-quarantine-lane.sh backend frontend blocks

      # Run from backend's own already-installed, version-pinned oxfmt (see backend/package.json)
      # rather than a bare `npx oxfmt`, which would silently resolve whatever `latest` happens to be
      # at run time -- exactly the floating-tag drift CLAUDE.md's Currency section rules out. The
      # root .oxfmtrc.json is picked up automatically since oxfmt searches upward from each target
      # path; its own `$schema` already points at backend/node_modules/oxfmt, confirming backend's
      # install is the one meant to be canonical for repo-root checks.
      - name: Format Check
        run: npx --prefix backend oxfmt --check backend frontend blocks
