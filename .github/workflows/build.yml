name: Build + Publish

on:
  push:
    branches:
      - scarlett

jobs:
  # Delegates to quality.yml (task 766) so the exact same typecheck/lint/format/unit-test gate that
  # runs on every pull request also blocks this push-triggered job before it reaches `Build Assets`,
  # `Build Blocks`, or the Docker login/build/push steps below. A `pull_request:` trigger was
  # deliberately NOT added directly to this workflow: `build`'s Docker publish (and its
  # Playwright/Postgres-backed e2e leg) has no place running against every PR, and `needs:` can't
  # reach across workflow files to gate it selectively -- see quality.yml's own header comment for
  # the full reasoning. Adding `pull_request:` here would mean either running the whole expensive
  # pipeline on every PR too, or threading `if: github.event_name == 'push'` through several jobs for
  # no benefit over the split already in place.
  quality:
    name: Quality Gates
    uses: ./.github/workflows/quality.yml

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Backing store for the Playwright suite's own first-run seeding below (the backend's DB-backed
    # model tests run in the `quality` job this one `needs:`, against their own postgres service --
    # see quality.yml -- not here).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # docker/login-action authenticates as github.repository_owner using the run's GITHUB_TOKEN,
      # whose packages:write scope only covers that owner's packages -- so the pushed tags must live
      # under this repo's own namespace, not a hard-coded one that may belong to someone else.
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json
            e2e/package-lock.json

      - name: Set Build Variables
        run: |
          echo "REL_VERSION=3.0.0-alpha.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Set Version
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      # The backend/frontend/blocks unit suites already ran in the `quality` job above (needs:
      # quality gates this job on them) -- re-running the same three `npm run test` invocations here
      # would just pay for them a second time per push with no new coverage. This job's postgres
      # service and DATABASE_URL are still needed below, for the Playwright leg's own first-run
      # seeding.

      # The e2e suite's own webServer boots `node backend` (backend/'s deps and the frontend's
      # `assets/` build were already produced by the steps above) and serves the frontend build the
      # same way the Docker image will — this is what "against a build of the stack" means here, and
      # why this leg neither builds nor needs the Docker image below: that image doesn't exist yet at
      # this point in the job, and won't be built at all until every test leg above has passed. There
      # is therefore only ever one Docker build per run, not a rebuild for this leg plus another for
      # the real push.
      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Suite
        working-directory: e2e
        run: npm test

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registers binfmt_misc handlers so Buildx (via its docker-container driver, set up next) can
      # cross-build the linux/arm64 layer below through QEMU emulation on this amd64 runner — see
      # OpenProject #2435/#2486. Must run before Buildx setup.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}:3.0.0-alpha
            ${{ env.IMAGE_NAMESPACE }}:${{ env.REL_VERSION }}

      - name: Prepare build archive
        run: |
          mkdir -p _dist/blocks
          cp -R assets _dist/assets
          cp -R blocks/compiled _dist/blocks/compiled
          cp -R backend _dist/backend
          cp LICENSE _dist/LICENSE
          cp config.sample.yml _dist/config.sample.yml
          cd _dist/backend
          npm ci --omit=dev
          cd -
          find ./_dist/ -printf "%P\n" | tar -czf wiki-js.tar.gz --no-recursion -C ./_dist/ -T -

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: wiki-js.tar.gz
