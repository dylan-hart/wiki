name: Build + Publish

on:
  push:
    branches:
      - scarlett

jobs:
  # The same gate that runs on every pull request, called here so `needs:` can block the Docker
  # publish on it. No `pull_request:` trigger on this workflow, deliberately: the publish and e2e
  # legs have no place running against every PR.
  quality:
    name: Quality Gates
    uses: ./.github/workflows/quality.yml

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    # GitHub's default job timeout is 6 hours. 45 minutes is headroom over this job's heaviest legs:
    # the builds, the e2e suite and a QEMU-emulated multi-arch Docker build/push.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    # For the Playwright leg's first-run seeding only: the backend's DB-backed suites run in the
    # `quality` job, against its own postgres service.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # docker/login-action authenticates as github.repository_owner using the run's GITHUB_TOKEN,
      # whose packages:write scope only covers that owner's packages -- so the pushed tags must live
      # under this repo's own namespace, not a hard-coded one.
      IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            blocks/package-lock.json
            e2e/package-lock.json

      - name: Set Build Variables
        run: |
          echo "REL_VERSION=3.0.0-alpha.$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

      - name: Set Version
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      # ONNXRUNTIME_NODE_INSTALL=skip: no CUDA download from nuget.org on a GPU-less runner. The
      # "Prepare build archive" install below is intentionally without it -- it builds the shipped
      # artifact.
      - name: Install Backend Dependencies
        working-directory: backend
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci

      - name: Build Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      # The e2e suite's webServer boots `node backend` against the `assets/` build produced above,
      # the same way the Docker image serves it -- so this leg needs no image, and the one Docker
      # build per run happens only after every test leg has passed.
      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Suite
        working-directory: e2e
        run: npm test

      # Only e2e's quarantine lane: quality.yml runs the backend/frontend/blocks lanes but installs
      # nothing the e2e lane needs. e2e.yml does not run it either, so the e2e lane runs on scarlett
      # pushes and not on pull requests.
      - name: Quarantine Lane, e2e (report-only)
        continue-on-error: true
        run: ./scripts/ci-quarantine-lane.sh e2e

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registers binfmt_misc handlers so Buildx can cross-build the linux/arm64 layer below through
      # QEMU emulation on this amd64 runner. Must run before Buildx setup.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Consumed only for its labels/annotations outputs: build-push-action's `tags:` below stay the
      # literal alpha/run-numbered ones, not this action's tag generation. source/revision/created/
      # version/licenses are left to the action's own GitHub-context derivation.
      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          labels: |
            org.opencontainers.image.title=Cardinal.js
            org.opencontainers.image.description=Next-generation open source wiki
            org.opencontainers.image.vendor=Cardinal.js
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}

      - name: Build and push Docker images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAMESPACE }}:3.0.0-alpha
            ${{ env.IMAGE_NAMESPACE }}:${{ env.REL_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Prepare build archive
        run: |
          mkdir -p _dist/blocks
          cp -R assets _dist/assets
          cp -R blocks/compiled _dist/blocks/compiled
          cp -R backend _dist/backend
          cp LICENSE _dist/LICENSE
          cp config.sample.yml _dist/config.sample.yml
          cd _dist/backend
          npm ci --omit=dev
          cd -
          find ./_dist/ -printf "%P\n" | tar -czf wiki-js.tar.gz --no-recursion -C ./_dist/ -T -

      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: wiki-js.tar.gz
