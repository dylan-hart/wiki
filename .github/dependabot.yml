version: 2

updates:
  # Independently-installed npm workspaces — there is no root manifest, so no root entry.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /blocks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # `directory: /` is how Dependabot addresses the workflow files under .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
