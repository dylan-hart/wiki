# git-cliff configuration; schema: https://git-cliff.org/docs/configuration

[changelog]
# Tera template, rendered once per release.
header = """
# Changelog\n
All notable changes to this project are documented in this file.\n
"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}
"""
trim = true
# So `--unreleased` right after a release prints an explicit empty section rather than nothing.
render_always = true
footer = ""
postprocessors = [{ pattern = '<REPO>', replace = "https://github.com/requarks/wiki" }]

[git]
# Only `type[(scope)][!]: description` commits are considered, which drops the pre-Conventional-
# Commits history ("Update README.md", "Merge branch ...") without special-casing it.
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
  # The capture group excludes the `#` so one group serves both halves: `#${1}` as the link text,
  # bare `${1}` as the target. Capturing the `#` too yields `/pull/#123`, a 404.
  { pattern = '\(#([0-9]+)\)$', replace = "([#${1}](<REPO>/pull/${1}))" }
]
protect_breaking_commits = false

# `<!-- N -->` prefixes are stripped by the template (`striptags`) and exist only to force group
# render order, since `group_by` otherwise sorts alphabetically. `(?i)` because this fork's history
# is not consistent about casing (`Fix:` as well as `fix:`). Chores is a catch-all (`.*`) rather
# than an enumerated whitelist, which would drop any type outside it with a "grouping error".
commit_parsers = [
  { message = "(?i)^feat", group = "<!-- 0 -->Features" },
  { message = "(?i)^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "(?i)^refactor", group = "<!-- 2 -->Refactors" },
  { message = ".*", group = "<!-- 3 -->Chores" }
]
# Not load-bearing for grouping — the catch-all above always matches — but it partners with
# `filter_unconventional` to drop commits that do not parse as a conventional commit at all.
filter_commits = true
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
